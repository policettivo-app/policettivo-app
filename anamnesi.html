    .save-state { font-size: 11px; font-weight: 700; color: #333; }

    .intro { font-size: 12px; color: #666; margin-bottom: 16px; line-height: 1.5; }
    .sec { background: #fff; border: 1px solid #e8e8e8; border-radius: 14px; margin-bottom: 10px; overflow: hidden; }

    .sec-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; cursor: pointer; user-select: none; }
    .sec-head:hover { background: #fafafa; }
    .sec-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
    .sec-num { background: #FFD008; color: #000; width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex-shrink: 0; }

    .sec-state { font-size: 11px; color: #bbb; display: flex; align-items: center; gap: 8px; }

    .sec-arrow { transition: transform .2s; font-size: 12px; color: #999; }

    .q-label { font-size: 12px; font-weight: 700; color: #444; margin-bottom: 8px; }

    .red-sec .chip.on { background: #c62828; border-color: #c62828; color: #fff; }

    .num-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .vas-wrap { display: flex; align-items: center; gap: 12px; }
    .vas-wrap input[type=range] { flex: 1; accent-color: #FFD008; height: 22px; }
    .vas-val { font-size: 16px; font-weight: 800; min-width: 26px; text-align: center; }
    .shared-hint { font-size: 10.5px; color: #999; margin-top: 4px; }
    .concl { background: #fffde7; border: 2px solid #FFD008; }
    .toolbar-open { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .btn-mini { background: #fff; border: 1.5px solid #ddd; padding: 7px 13px; border-radius: 8px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }

      { n:25, id:'trattamenti', t:'Trattamenti precedenti', items:[
        { k:'trattamenti', type:'multi', label:'Quali trattamenti sono già stati eseguiti?', opts:'Nessuno|Fisioterapia|Terapia manuale|Osteopatia|Esercizio terapeutico|Terapia farmacologica|Infiltrazioni|Intervento chirurgico|Altro' },
        { k:'trattamenti_esito', type:'single', label:'Qual è stato il risultato?', opts:'Nessun beneficio|Beneficio temporaneo|Beneficio parziale|Beneficio significativo|Peggioramento|Non valutabile' }
      ]},
      { n:26, id:'esami', t:'Esami e valutazioni precedenti', items:[
        { k:'esami', type:'multi', label:'Sono stati effettuati esami?', opts:'Nessuno|Radiografia|Ecografia|Risonanza magnetica|TAC|Elettromiografia|Esami neurologici|Esami vestibolari|Esami del sangue|Visita ortopedica|Visita fisiatrica|Visita neurologica|Altra valutazione specialistica' },
        { k:'esami_txt', type:'text', label:'Esito o osservazioni' }
      ]},
      { n:27, id:'redflags', t:'Screening di sicurezza', red:1, items:[
        { k:'redflags', type:'multi', rf:'voci', label:'Sono presenti uno o più dei seguenti elementi?', opts: RF_VOCI.join('|') },
        { k:'redflags_txt', type:'text', rf:'nota', label:'Osservazioni / altre red flag' }
      ]},
      { n:28, id:'obiettivi', t:'Obiettivi', items:[
        { k:'obiettivi', type:'multi', label:'Qual è l\'obiettivo principale?', opts:'Ridurre il dolore|Migliorare la mobilità|Migliorare la postura percepita|Migliorare l\'equilibrio|Migliorare il cammino|Aumentare l\'autonomia|Tornare al lavoro|Tornare allo sport|Migliorare il sonno|Prevenire recidive|Comprendere il problema|Altro' },
        { k:'obiettivi_breve', type:'text', label:'Obiettivi a breve termine', one:1 },
        { k:'obiettivi_medio', type:'text', label:'Obiettivi a medio termine', one:1 },
        { k:'obiettivi_lungo', type:'text', label:'Obiettivi a lungo termine', one:1 }
      ]},
      { n:29, id:'conclusioni', t:'Note e conclusioni', concl:1, items:[
        { k:'note_prof', type:'text', label:'Note anamnestiche e osservazioni del professionista' },
        { k:'conclusioni', type:'text', label:'Conclusioni' }
      ]}
    ]

    function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }

    function getVal(item) {
      if (item.rf) return item.rf === 'voci' ? rf.voci : rf.nota
      if (item.share) return shared[item.share] != null ? shared[item.share] : ''
      return A[item.k] != null ? A[item.k] : (item.type === 'multi' ? [] : '')
    }

    function setVal(item, v) {
      if (item.rf) { if (item.rf === 'voci') rf.voci = v; else rf.nota = v }
      else if (item.share) shared[item.share] = v
      else A[item.k] = v
      scheduleSave()
      aggiornaDot(item._sec)
    }

    function secCompilata(sec) {
      return sec.items.some(it => {
        const v = getVal(it)
        return Array.isArray(v) ? v.length > 0 : (v !== '' && v != null)
      })
    }

    function aggiornaDot(secId) {
      const sec = SECTIONS.find(s => s.id === secId)
      if (!sec) return
      const dot = document.getElementById('dot-' + secId)
      if (dot) dot.classList.toggle('on', secCompilata(sec))
    }

    function render() {
      const wrap = document.getElementById('sections')
      const isM = (patient.sesso || '').toLowerCase() === 'm'
      wrap.innerHTML = SECTIONS.filter(s => !(s.onlyF && isM)).map(sec => {
        const body = sec.items.map(it => { it._sec = sec.id; return renderItem(sec, it) }).join('')
        const cls = 'sec' + (sec.red ? ' red-sec' : '') + (sec.concl ? ' concl' : '')
        return '<div class="' + cls + '" id="sec-' + sec.id + '">' +
          '<div class="sec-head" onclick="toggleSec(\'' + sec.id + '\')">' +
            '<span class="sec-title"><span class="sec-num">' + sec.n + '</span>' + esc(sec.t) + '</span>' +
            '<span class="sec-state"><span class="dot' + (secCompilata(sec) ? ' on' : '') + '" id="dot-' + sec.id + '"></span><span class="sec-arrow">▾</span></span>' +
          '</div>' +
          '<div class="sec-body">' + body + '</div>' +
        '</div>'
      }).join('')
    }

    function renderItem(sec, it) {
      const v = getVal(it)
      let html = '<div class="q"><div class="q-label">' + esc(it.label) + '</div>'
      if (it.type === 'single' || it.type === 'multi') {
        const opts = it.opts.split('|')
        html += '<div class="chips">' + opts.map(o => {
          const on = it.type === 'multi' ? (Array.isArray(v) && v.indexOf(o) !== -1) : (v === o)
          return '<button type="button" class="chip' + (on ? ' on' : '') + '" onclick="clickChip(\'' + sec.id + '\',\'' + it.k + '\',this)" data-opt="' + esc(o) + '">' + esc(o) + '</button>'
        }).join('') + '</div>'
      } else if (it.type === 'vas') {
        html += '<div class="vas-wrap"><input type="range" min="0" max="10" step="1" value="' + (v === '' ? 0 : v) + '" oninput="vasInput(\'' + sec.id + '\',\'' + it.k + '\',this)"><span class="vas-val" id="vas-' + it.k + '">' + (v === '' ? '—' : v) + '</span></div>'
      } else if (it.type === 'num') {
        html += '<input type="number" step="0.1" inputmode="decimal" value="' + esc(v) + '" oninput="fieldInput(\'' + sec.id + '\',\'' + it.k + '\',this.value)">'
      } else {
        const rows = it.one ? 1 : 3
        html += '<textarea rows="' + rows + '" oninput="fieldInput(\'' + sec.id + '\',\'' + it.k + '\',this.value)">' + esc(v) + '</textarea>'
      }
      if (it.share) html += '<div class="shared-hint">↔ Collegato all\'anagrafica: modificandolo qui si aggiorna ovunque.</div>'
      if (it.rf) html += '<div class="shared-hint">↔ Condiviso con la visita fisioterapica e col banner rosso in scheda paziente: è lo stesso dato.</div>'
      html += '</div>'
      return html
    }

    function findItem(secId, k) {
      const sec = SECTIONS.find(s => s.id === secId)
      return sec ? sec.items.find(i => i.k === k) : null
    }

    function clickChip(secId, k, btn) {
      const it = findItem(secId, k); if (!it) return
      const opt = btn.dataset.opt
      if (it.type === 'multi') {
        let v = getVal(it); v = Array.isArray(v) ? v.slice() : []
        const idx = v.indexOf(opt)
        if (idx === -1) {
          // opzioni "esclusive": Nessuno/No/Nessuna deselezionano il resto e viceversa
          const excl = /^(no|nessuno|nessuna.*|non porta occhiali)$/i.test(opt)
          if (excl) v = [opt]
          else { v = v.filter(x => !/^(no|nessuno|nessuna.*|non porta occhiali)$/i.test(x)); v.push(opt) }
        } else v.splice(idx, 1)
        setVal(it, v)
        // ridisegna solo i chip di questa domanda
        const chips = btn.parentElement.querySelectorAll('.chip')
        chips.forEach(c => c.classList.toggle('on', v.indexOf(c.dataset.opt) !== -1))
      } else {
        const cur = getVal(it)
        const nv = cur === opt ? '' : opt
        setVal(it, nv)
        const chips = btn.parentElement.querySelectorAll('.chip')
        chips.forEach(c => c.classList.toggle('on', c.dataset.opt === nv))
      }
    }

    function vasInput(secId, k, input) {
      const it = findItem(secId, k); if (!it) return
      setVal(it, parseInt(input.value, 10))
      document.getElementById('vas-' + k).textContent = input.value
    }

    function fieldInput(secId, k, val) {
      const it = findItem(secId, k); if (!it) return
      const v = it.type === 'num' ? (val === '' ? '' : parseFloat(val)) : val
      setVal(it, v)
    }

    function toggleSec(id) {
      document.getElementById('sec-' + id).classList.toggle('open')
    }
    function apriTutte(open) {
      document.querySelectorAll('.sec').forEach(s => s.classList.toggle('open', open))
    }

    function scheduleSave() {
      const st = document.getElementById('save-state')
      st.textContent = 'Modifiche…'; st.classList.remove('saved')
      clearTimeout(saveTimer)
      saveTimer = setTimeout(salva, 1200)
    }

    async function salva() {
      const st = document.getElementById('save-state')
      st.textContent = 'Salvataggio…'
      const updates = { anamnesi: A, anamnesi_updated_at: new Date().toISOString(), red_flags: { voci: rf.voci, nota: rf.nota } }
      Object.keys(shared).forEach(k => { updates[k] = shared[k] === '' ? null : shared[k] })
      const { error } = await _sb.from('patients').update(updates).eq('id', pid)
      if (error) { st.textContent = '⚠️ Errore salvataggio'; st.classList.remove('saved'); console.warn(error); return }
      st.textContent = '● Salvato ' + new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })
      st.classList.add('saved')
    }

    function tornaIndietro() {
      const back = params.get('back')
      if (back === 'visita' && params.get('vid')) window.location.href = 'visita.html?id=' + params.get('vid')
      else if (back === 'posturale' && params.get('vid')) window.location.href = 'valutazione-posturale.html?id=' + params.get('vid')
      else window.location.href = 'paziente.html?id=' + pid
    }

    function stampaAnamnesi() {
      const pa = document.getElementById('print-area')
      const isM = (patient.sesso || '').toLowerCase() === 'm'
      const oggi = new Date().toLocaleDateString('it-IT')
      const agg = patient.anamnesi_updated_at ? new Date(patient.anamnesi_updated_at).toLocaleDateString('it-IT') : oggi
      let html = '<div class="pr-head"><div><span class="pr-logo">POLICETTIVO®</span> <span class="pr-title">Anamnesi</span></div>' +
        '<div class="pr-meta"><b>' + esc((patient.nome || '') + ' ' + (patient.cognome || '')) + '</b><br>Aggiornata al: ' + agg + '<br>Stampata il: ' + oggi + '<br>Documento riservato</div></div>'
      SECTIONS.filter(s => !(s.onlyF && isM)).forEach(sec => {
        const rows = sec.items.map(it => {
          const v = getVal(it)
          const txt = Array.isArray(v) ? v.join(', ') : String(v == null ? '' : v)
          if (!txt) return ''
          return '<div class="pr-row"><b>' + esc(it.label) + ':</b> ' + esc(txt) + '</div>'
        }).filter(Boolean).join('')
        if (!rows) return
        html += '<div class="pr-sec"><div class="pr-sec-t' + (sec.red ? ' pr-red' : '') + '">' + sec.n + '. ' + esc(sec.t) + '</div>' + rows + '</div>'
      })
      pa.innerHTML = html
      window.print()
    }

    /* cartella-in-anamnesi-v1 — la scheda si disegna alla prima apertura.
       Se il file condiviso non si e' caricato non si ripiega su una copia
       scritta qui: si dice che manca. */
    var _relMontata = false
    function toggleRelazione() {
      var body  = document.getElementById('sec-relazione-body')
      var arrow = document.getElementById('rel-arrow')
      var aperta = body.style.display !== 'none'
      body.style.display = aperta ? 'none' : 'block'
      arrow.style.transform = aperta ? '' : 'rotate(180deg)'
      if (aperta) return
      if (!_relMontata) {
        if (!window.polCartellaClinica) {
          document.getElementById('cartella-relazione-mount').innerHTML =
            '<div style="padding:22px;text-align:center;color:#c62828;font-size:13px;font-weight:600">Non si &egrave; caricato <code>js/cartella-clinica.js</code>: la relazione clinica non &egrave; disponibile. Ricarica la pagina.</div>'
          return
        }
        window.polCartellaClinica.montaRelazione({ sb: _sb, patientId: pid, mount: 'cartella-relazione-mount' })
        _relMontata = true
      }
      window.polCartellaClinica.ricarica()
    }

    async function init() {
      if (!pid) { alert('Manca il paziente (?pid=...)'); return }
      const { data: { session } } = await _sb.auth.getSession()
      if (!session) { window.location.href = 'login.html'; return }
      const { data: p, error } = await _sb.from('patients').select('*').eq('id', pid).maybeSingle()
      if (!p) { alert('Paziente non trovato o non accessibile.'); return }
      patient = p
      document.getElementById('pt-name').textContent = (p.nome || '') + ' ' + (p.cognome || '')
      try { A = typeof p.anamnesi === 'string' ? JSON.parse(p.anamnesi || '{}') : (p.anamnesi || {}) } catch (e) { A = {} }
      // red flags: legge il magazzino unico condiviso con la visita
      const rawRf = p.red_flags
      if (Array.isArray(rawRf)) rf = { voci: rawRf.filter(x => typeof x === 'string'), nota: '' }
      else if (rawRf && typeof rawRf === 'object') rf = { voci: Array.isArray(rawRf.voci) ? rawRf.voci.filter(x => typeof x === 'string') : [], nota: typeof rawRf.nota === 'string' ? rawRf.nota : '' }
      // migrazione: vecchie red flag salvate dentro l'anamnesi → spostale nel magazzino unico
      if (Array.isArray(A.redflags) && A.redflags.length) {
        const MAP = { 'Trauma importante recente':'Trauma recente significativo','Febbre o infezione recente':'Febbre/malessere sistemico','Perdita di peso non intenzionale':'Calo ponderale inspiegato','Dolore notturno costante':'Dolore notturno non meccanico','Debolezza progressiva':'Deficit neurologici progressivi','Perdita progressiva di sensibilità':'Deficit neurologici progressivi','Alterazioni recenti di vescica o intestino':'Disturbi sfinterici o sospetta cauda equina','Alterazione sensibilità perineale':'Disturbi sfinterici o sospetta cauda equina' }
        A.redflags.forEach(v => { const m = MAP[v] || v; if (!/^(nessuno|altro)$/i.test(v) && RF_VOCI.indexOf(m) !== -1 && rf.voci.indexOf(m) === -1) rf.voci.push(m) })
        if (A.redflags_txt && (rf.nota || '').indexOf(A.redflags_txt) === -1) rf.nota = (rf.nota ? rf.nota + ' · ' : '') + A.redflags_txt
        delete A.redflags; delete A.redflags_txt
        scheduleSave()
      }
      shared = {
        altezza: p.altezza != null ? p.altezza : '',
        peso: p.peso != null ? p.peso : '',
        taglia_piede: p.taglia_piede != null ? p.taglia_piede : '',
        patologie_pregresse: p.patologie_pregresse || '',
        farmaci_in_uso: p.farmaci_in_uso || '',
        allergie: p.allergie || '',
        interventi_chirurgici: p.interventi_chirurgici || '',
        sport_praticato: p.sport_praticato || ''
      }
      if (p.anamnesi_updated_at) {
        document.getElementById('save-state').textContent = 'Ultimo agg.: ' + new Date(p.anamnesi_updated_at).toLocaleDateString('it-IT')
      }
      render()
      // apri la prima sezione non compilata (o la prima)
      const first = SECTIONS.find(s => !secCompilata(s)) || SECTIONS[0]
      const el = document.getElementById('sec-' + first.id)
      if (el) el.classList.add('open')
    }

    init()
  </script>
</body>
</html>
