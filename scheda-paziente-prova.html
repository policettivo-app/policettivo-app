  // Niente riposi (scheda-paziente-v2: Giuliano «il riposo non serve»). Le note non sono passi.
  function costruisciPassi(rr, sch, solo) {
    const es = rr.filter(function (r) { return r.tipo === 'esercizio' })
    const giri = solo != null ? 1 : (Number(sch.ripeti_volte) || 1)
    const lista = solo != null ? [es[solo]] : es
    const out = []
    for (let g = 1; g <= giri; g++) {
      lista.forEach(function (r) {
        const tot = Number(r.serie) || 1
        for (let s = 1; s <= tot; s++) {
          out.push({ tipo: 'es', riga: r, serie: s, serieTot: tot, giro: g, giri: giri, nEs: es.indexOf(r) + 1, totEs: es.length })
        }
      })
    }
    return out
  }
  function stimaMinuti(rr, sch) {
    const p = costruisciPassi(rr, sch)
    const ritmo = Number(sch.ritmo_sec) || 3
    const s = p.reduce(function (a, x) {
      return a + (x.riga.misura === 'tempo' ? Number(x.riga.secondi) : Number(x.riga.ripetizioni) * ritmo)
    }, 0) + Math.max(0, p.length - 1) * ANNUNCIO_SEC
    return Math.max(1, Math.round(s / 60))
  }
  function ytId(url) {
    if (!url) return null
    const m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/)
    return m ? m[1] : null
  }
  // Stessa regola di loadSmile in protocollo.html: giorni di fila con «completato» e giorni dall'ultima volta.
  function calcolaSmile(entries, oggiData) {
    const completate = (entries || []).filter(function (e) { return e.completato })
      .sort(function (a, b) { return a.data < b.data ? 1 : -1 })
    const oggi = new Date(oggiData); oggi.setHours(0, 0, 0, 0)
    const giorno = function (d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') }
    let streak = 0
    const dc = new Date(oggi)
    for (let i = 0; i < 30; i++) {
      const ds = giorno(dc)
      if (completate.find(function (e) { return e.data === ds })) { streak++; dc.setDate(dc.getDate() - 1) } else break
    }
    const ultima = completate.length ? new Date(completate[0].data + 'T00:00:00') : null
    const diff = ultima ? Math.max(0, Math.round((oggi - ultima) / 86400000)) : 999
    let emoji, titolo, tipo
    if (diff === 0 && streak >= 6) { emoji = '🤩'; titolo = streak + ' giorni di fila!'; tipo = 'top' }
    else if (diff === 0 && streak >= 3) { emoji = '😄'; titolo = streak + ' giorni consecutivi!'; tipo = 'great' }
    else if (diff === 0) { emoji = '😊'; titolo = 'Hai fatto gli esercizi oggi!'; tipo = 'good' }
    else if (diff === 1) { emoji = '😐'; titolo = 'Ieri hai saltato'; tipo = 'neutral' }
    else if (diff === 2) { emoji = '😔'; titolo = '2 giorni senza esercizi'; tipo = 'bad' }
    else if (diff === 999) { emoji = '😢'; titolo = 'Nessun esercizio ancora'; tipo = 'worst' }
    else { emoji = '😢'; titolo = diff + ' giorni senza esercizi'; tipo = 'worst' }
    return { emoji: emoji, titolo: titolo, tipo: tipo, streak: streak }
  }
  function immagineDi(r, slug) {
    const lista = window.SCHEDA_IMMAGINI || []
    const nome = String(r.nome || '').toLowerCase()
    const t = lista.find(function (x) {
      if (x.slug && slug && x.slug === slug) return true
      if (x.id && r.elicoidale_id && x.id === r.elicoidale_id) return true
      if (!x.nome) return false
      // «schema 1» trova «Schema 1» e «Schema 1 — …», ma non «Schema 10»
      const k = nome.indexOf(String(x.nome).toLowerCase())
      return k > -1 && !/\d/.test(nome.charAt(k + String(x.nome).length))
    })
    return t || null
  }

  // Il video di ogni esercizio: video del paziente → libreria → cuscini → niente (si va col nome).
  async function caricaMedia() {
    const exIds = righe.map(function (r) { return r.exercise_id }).filter(Boolean)
    const vIds = righe.map(function (r) { return r.video_id }).filter(Boolean)
    const [ex, vv] = await Promise.all([

      vIds.length ? sb.from('exercise_videos').select('*').in('id', vIds) : Promise.resolve({ data: [] })
    ])
    const eli = (typeof EXERCISES_ELICOIDALI !== 'undefined' && Array.isArray(EXERCISES_ELICOIDALI)) ? EXERCISES_ELICOIDALI : []
    righe.forEach(function (r) {
      let m = null
      if (r.video_id) { const v = (vv.data || []).find(function (x) { return x.id === r.video_id }); if (v && v.url) m = { url: v.url, foto: v.tipo !== 'video' } }
      const exRiga = r.exercise_id ? (ex.data || []).find(function (x) { return x.id === r.exercise_id }) : null
      if (exRiga && exRiga.slug === '0-3r') tre[r.id] = true
      if (/3\s*respiri|tre\s+respiri/i.test(r.nome || '')) tre[r.id] = true
      const im = immagineDi(r, exRiga && exRiga.slug); if (im) immagini[r.id] = im
      if (!m && exRiga && exRiga.video_url) m = ytId(exRiga.video_url) ? { yt: ytId(exRiga.video_url) } : { url: exRiga.video_url }
      if (!m && r.elicoidale_id) { const e = eli.find(function (x) { return x.id === r.elicoidale_id }); if (e && e.video_url) m = { yt: ytId(e.video_url) } }
      if (m) media[r.id] = m
    })
  }

    const tic = function () {
      if (inPausa) return
      restante = Math.max(0, scadenza - Date.now())
      ogniTic(Math.ceil(restante / 1000), restante / (secondi * 1000))

  function anello(classe, cifra, sotto) {
    const C = 2 * Math.PI * 54
    return '<div class="anello ' + classe + '"><svg viewBox="0 0 120 120"><circle class="fondo" cx="60" cy="60" r="54" fill="none" stroke-width="9"/>' +
      '<circle class="arco" id="arco" cx="60" cy="60" r="54" fill="none" stroke-width="9" stroke-dasharray="' + C + '" stroke-dashoffset="0"/></svg>' +
      '<div class="dentro"><div class="cifra" id="cifra">' + cifra + '</div><div class="sotto">' + sotto + '</div></div></div>'
  }
  function aggiornaAnello(sec, frazione) {
    const C = 2 * Math.PI * 54
    const c = $('cifra'); if (c) c.textContent = sec
    const a = $('arco'); if (a) a.setAttribute('stroke-dashoffset', String(C * (1 - frazione)))
  }

  // «Adesso tocca a…»: 3 secondi col nome grande, poi l'esercizio parte da solo. Un tocco lo salta.
  function annuncio() {
    const p = passi[iPasso]
    intestazione(p)
    const r = p.riga
    const im = immagini[r.id]
    $('centro').className = 'palco-centro'
    $('centro').innerHTML = '<div class="annuncio" onclick="mostra()">' +
      (im ? '<img class="foto-annuncio" src="' + esc(im.img) + '" alt="' + esc(im.alt || r.nome) + '">' : '') +
      '<div class="etichetta">' + T.adessoTocca + '</div>' +
      '<div class="nome-grande">' + esc(r.nome) + '</div>' +
      (p.serieTot > 1 ? '<div class="serie">' + T.serie(p.serie, p.serieTot) + '</div>' : '') +
      '<div class="q-grande">' + quanto(Object.assign({}, r, { serie: 1 })) + '</div>' +
      '<div class="pallini" id="pallini">' + '<i></i>'.repeat(ANNUNCIO_SEC) + '</div></div>'
    $('giu').innerHTML = '<button class="grande" id="btn-via" onclick="mostra()">' + T.via + '</button>'
    conta(ANNUNCIO_SEC, function (sec) {
      document.querySelectorAll('#pallini i').forEach(function (el, k) { el.classList.toggle('on', k < ANNUNCIO_SEC - sec + 1) })
    }, mostra)
  }

  // La schermata dell'esercizio (scheda-paziente-v5): in alto il nome, in mezzo l'infografica che fa capire
  // a colpo d'occhio cosa si fa, sotto il pannello del timer. Il tempo NON parte da solo: «▶ AVVIA».
  let partito = false
  window.mostra = function () {
    ferma(); partito = false; chiedeDolore = false
    const p = passi[iPasso]
    intestazione(p)
    const r = p.riga
    const m = media[r.id]
    const im = immagini[r.id]
    const figura = im && (im.scheda || im.img)
    const testa = '<div class="es-testa">' +
      (p.serieTot > 1 ? '<div class="etichetta">' + T.serie(p.serie, p.serieTot) + '</div>' : '') +
      '<div class="nome-es">' + esc(r.nome) + '</div>' +
      (r.testo ? '<div class="frase">' + esc(r.testo) + '</div>' : '') + '</div>'
    const pill = '<div class="pill-row">' +
      (iPasso > 0 ? '<button class="pillbtn" id="btn-prec" onclick="indietro()">' + T.prec + '</button>' : '') +
      (m ? '<button class="pillbtn giallo guarda" onclick="guarda()">' + T.video + '</button>' : '') +
      '<button class="pillbtn rosso" id="btn-dolore" onclick="dolore()">' + T.doloreCorto + '</button></div>'
    const centro = $('centro')
    if (figura) {
      centro.className = 'palco-centro pieno'
      centro.innerHTML = testa +
        '<button class="figura" onclick="ingrandisci()" aria-label="' + esc(T.ingrandisci) + '">' +
          '<img src="' + esc(figura) + '" alt="' + esc(im.alt || r.nome) + '"><span class="lente">' + T.ingrandisci + '</span></button>' +
        pill + (tre[r.id] && !im.scheda ? '<div class="hint-3r">' + T.hint3r + '</div>' : '')
    } else {
      centro.className = 'palco-centro'
      centro.innerHTML = testa + (tre[r.id] ? '<div class="hint-3r">' + T.hint3r + '</div>' : '') +
        (r.misura === 'tempo' ? anello('', r.secondi, T.secondi)
          : '<div><div class="rip-grandi">' + r.ripetizioni + '</div><div class="rip-sotto">' + T.ripetizioni + '</div></div>') + pill
    }
    if (r.misura === 'tempo') {
      $('giu').innerHTML = '<div class="pannello">' + (figura ? anello('mini', r.secondi, T.secondi) : '') +
        '<button class="grande" id="btn-avvia" onclick="avvia()">' + T.avvia + '</button>' +
        '<button class="tondo" onclick="avanti()" aria-label="Avanti">' + T.salta + '</button></div>'
    } else {
      $('giu').innerHTML = '<div class="pannello">' + (figura ? '<div class="rip-mini"><b>' + r.ripetizioni + '</b><span>' + T.ripetizioni + '</span></div>' : '') +
        '<button class="grande" id="btn-fatto" onclick="avanti()">' + T.fatto + '</button></div>'
    }
  }
  window.avvia = function () {
    const p = passi[iPasso]; if (!p) return
    if (!partito) { partito = true; conta(Number(p.riga.secondi), aggiornaAnello, avanti) }
    else pausa()
    aggiornaAvvia()
  }
  function aggiornaAvvia() {
    const b = $('btn-avvia'); if (!b) return
    b.textContent = !partito ? T.avvia : (inPausa ? T.riprendiBtn : T.pausaBtn)
    b.classList.toggle('scuro', partito && !inPausa)
  }
  window.ingrandisci = function () {
    const p = passi[iPasso]; if (!p) return
    const im = immagini[p.riga.id]; if (!im) return
    $('modal-tt').textContent = p.riga.nome
    $('modal-sch').className = 'sch alta'
    $('modal-sch').innerHTML = '<img src="' + esc(im.scheda || im.img) + '" alt="' + esc(im.alt || p.riga.nome) + '">'
    $('modal').classList.add('show')
  }

  window.avanti = function () {
    ferma(); chiedeUscita = false
    iPasso++
    if (iPasso >= passi.length) return fine()
    annuncio()
  }

  window.indietro = function () {
    ferma(); chiedeUscita = false
    if (iPasso > 0) iPasso--
    mostra()
  }
  // ⚠ Dolore: due tocchi (come la conferma di esercizio.html). Col paziente vero scriverà la nota nel diario
  // come fa oggi (save_diary_entry, interrotto_per_dolore). In anteprima non salva e lo dice.
  window.dolore = function () {
    const b = $('btn-dolore'); if (!b) return
    if (!chiedeDolore) { chiedeDolore = true; if (timer && !inPausa) pausa(); b.textContent = T.dolore2; b.classList.add('chiede'); return }
    chiedeDolore = false
    chiudiPalco()
    const e = $('err'); e.textContent = T.doloreAnteprima; e.classList.add('show')
    window.scrollTo(0, 0)
  }
  window.esci = function () {
    if (!chiedeUscita) { chiedeUscita = true; const d = $('dove'); d.innerHTML = '<b>' + T.esciChiede + '</b>'; return }
    chiudiPalco()
  }
  function chiudiPalco() {
    ferma(); if (audio) { try { audio.pause() } catch (e) {} audio = null } $('palco').classList.remove('show'); document.body.style.overflow = ''
    try { if (wake) wake.release() } catch (e) {} wake = null
  }

  function fine(rapido) {
    $('avanz').style.width = '100%'
    const es = passi.filter(function (x) { return x.tipo === 'es' })
    const nomi = new Set(es.map(function (x) { return x.riga.id }))
    const minuti = rapido ? null : Math.max(1, Math.round((Date.now() - inizioSeduta) / 60000))
    const giri = es.length ? es[0].giri : 1
    $('dove').innerHTML = ''
    $('centro').className = 'palco-centro'
    $('centro').innerHTML = '<div class="festa"><div class="coppa">🏆</div><h2>' + T.bravo + '</h2><p>' + T.finito + '</p>' +
      '<div class="riep"><div><b>' + nomi.size + '</b><span>' + T.fattiN + '</span></div>' + (minuti ? '<div><b>' + minuti + '</b><span>' + T.tempoN + '</span></div>' : '') +
      (giri > 1 ? '<div><b>' + giri + '</b><span>' + T.giriN + '</span></div>' : '') + '</div>' +
      '<div class="etichetta" style="color:#fff;letter-spacing:0;text-transform:none;font-size:16px">' + T.comeStai + '</div>' +
      '<div class="facce" id="facce">' + ['😣', '🙁', '😐', '🙂', '😄'].map(function (f, i) {
        return '<button onclick="faccia(' + (i + 1) + ')" aria-label="Voto ' + (i + 1) + ' su 5">' + f + '</button>' }).join('') + '</div>' +
      '<div class="avviso-prova" id="dopo-faccia">' + T.nonSalva + '</div>' +
      '<div class="streak"><div class="streak-num">🔥</div><div class="streak-lab">' + T.streak + '</div><div class="streak-ant">' + T.streakAnteprima + '</div></div>' +
      '<div class="motivante">' + T.frasi[Math.floor(Math.random() * T.frasi.length)] + '</div>' +
      '<div class="sera-hint">' + T.seraHint + '</div></div>'
    $('dove').innerHTML = '<button class="suono" id="btn-suono" onclick="cambiaSuono()" aria-label="Musica">' + (suono ? '🔊' : '🔇') + '</button>'
    setTimeout(musica, 300)
    // 🧪 In anteprima niente si salva: la faccina della casa si aggiorna solo sullo schermo, per far vedere come cambierebbe.
    try {
      const oggi = new Date(), g = oggi.getFullYear() + '-' + String(oggi.getMonth() + 1).padStart(2, '0') + '-' + String(oggi.getDate()).padStart(2, '0')
      diarioLetto = (diarioLetto || []).filter(function (e) { return e.data !== g }).concat([{ data: g, completato: true }])
      smile = calcolaSmile(diarioLetto, oggi); smile.anteprima = true
      disegnaCasa()
    } catch (e) {}
    $('giu').innerHTML = '<button class="grande" onclick="chiudiFine()">' + T.torna + '</button>'
    coriandoli()
  }
  // La musichetta di fine seduta: lo stesso file di esercizio.html e rapida.html.
  let audio = null
  function musica() {
    if (!suono) return
    try { audio = new Audio('magnific_epic-victory.mp3'); audio.volume = 0.7; const pr = audio.play(); if (pr && pr.catch) pr.catch(function () {}) } catch (e) {}
  }
  window.cambiaSuono = function () {
    suono = !suono
    try { localStorage.setItem('policettivo_sound', suono ? 'on' : 'off') } catch (e) {}
    $('btn-suono').textContent = suono ? '🔊' : '🔇'
    if (!suono && audio) { try { audio.pause() } catch (e) {} }
    else if (suono && (!audio || audio.paused)) musica()
  }
  window.faccia = function (v) {
    document.querySelectorAll('#facce button').forEach(function (b, i) { b.classList.toggle('on', i === v - 1) })
    $('dopo-faccia').textContent = T.grazie + ' ' + T.nonSalva
  }
  window.chiudiFine = function () { chiudiPalco(); const c = document.querySelector('.coriandoli'); if (c) c.remove() }
  function coriandoli() {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return
    const box = document.createElement('div'); box.className = 'coriandoli'
    const colori = ['#FFD008', '#ffffff', '#7fd1ff', '#ff8a80']
    for (let i = 0; i < 60; i++) {
      const c = document.createElement('i')
      c.style.left = Math.random() * 100 + '%'
      c.style.background = colori[i % colori.length]
      c.style.animationDuration = (2 + Math.random() * 2) + 's'
      c.style.animationDelay = (Math.random() * .8) + 's'
      box.appendChild(c)
    }
    document.body.appendChild(box)
    setTimeout(function () { box.remove() }, 5000)
  }

  // ── video ──
  window.guarda = function () {
    const p = passi[iPasso]; if (!p || p.tipo !== 'es') return
    const m = media[p.riga.id]; if (!m) return
    if (timer && !inPausa) pausa()          // guardando il video il tempo si ferma
    $('modal-tt').textContent = p.riga.nome
    $('modal-sch').className = 'sch'
    $('modal-sch').innerHTML = m.yt
      ? '<iframe src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(m.yt) + '?rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>'
      : (m.foto ? '<img src="' + esc(m.url) + '" alt="">' : '<video src="' + esc(m.url) + '" controls playsinline preload="metadata"></video>')
    $('modal').classList.add('show')
  }
  window.chiudiVideo = function () { $('modal').classList.remove('show'); $('modal-sch').innerHTML = '' }

  init().catch(function (e) { console.error('[scheda-paziente]', e); errore('Errore di caricamento: ' + (e && e.message || e)) })
})()
</script>
</body>
</html>
