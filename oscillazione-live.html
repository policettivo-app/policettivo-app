<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vista in diretta — Oscillazione Policettiva</title>
<!-- oscillazione-live-v1 — IL VISORE. · live-tv-v1 (24 set: fondo scuro da TV, tempo grande, si aggancia da solo)
     Sta su un computer, un tablet, una TV: qualunque cosa apra una pagina web.
     Non misura niente e non salva niente: ascolta e disegna.

     PERCHE' ESISTE COSI'
       AirPlay e' solo Apple, Miracast e' solo Windows, il cast di Android e'
       un'altra cosa ancora: non esiste un modo senza codice che vada per tutti.
       Un indirizzo web invece lo apre chiunque. E l'aggancio non e' un link da
       copiare ma l'ACCOUNT: chi misura e chi guarda sono lo stesso
       professionista, e la pagina trova il canale da sola.

     ⚠️ QUELLO CHE ARRIVA SUL CANALE SONO SOLO ANGOLI. Nessun nome, nessun
        identificativo di paziente. Per questo un ospite col codice puo'
        guardare senza vedere di chi si tratta.

     ⚠️ IL CANE DA GUARDIA. Se il telefono si blocca o cambia pagina, i dati
        smettono di arrivare. Un disegno fermo che sembra vivo e' peggio di
        nessun disegno: dopo 3 secondi di silenzio la pagina lo DICE. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/oscillazione.js?v=referto-paziente-v1"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#fafafa;color:#111;
       font-family:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       font-size:16px;line-height:1.5}
  .barra{display:flex;align-items:center;justify-content:space-between;gap:14px;
         padding:12px 20px;background:#fff;border-bottom:1px solid #eee}
  .tit{font-size:17px;font-weight:800;letter-spacing:.2px}
  .sub{font-size:12px;color:#888}
  .stato{font-size:14px;font-weight:700;padding:6px 13px;border-radius:999px;
         background:#f2f2f2;color:#666;white-space:nowrap}
  .stato.attesa{background:#f2f2f2;color:#777}
  .stato.viva{background:#eef9f0;color:#0a5e26}
  .stato.rotta{background:#fff3f2;color:#a3271c}
  .scena{display:flex;align-items:center;justify-content:center;padding:18px;
         min-height:calc(100vh - 62px)}
  canvas{background:#fff;border:1px solid #eee;border-radius:20px;
         width:min(86vh,92vw);height:min(86vh,92vw);max-width:900px;max-height:900px;
         box-shadow:0 2px 16px rgba(0,0,0,.05)}
  .numeri{position:fixed;right:20px;bottom:20px;background:#fff;border:1px solid #eee;
          border-radius:16px;padding:14px 16px;box-shadow:0 2px 16px rgba(0,0,0,.07);
          display:none;min-width:210px}
  .numeri.on{display:block}
  .nr{display:flex;justify-content:space-between;gap:16px;font-size:14px;padding:3px 0}
  .nr b{font-variant-numeric:tabular-nums}
  .sw{position:fixed;left:20px;bottom:20px;background:#fff;border:1px solid #ddd;
      border-radius:999px;padding:9px 15px;font-size:13px;font-family:inherit;cursor:pointer}
  .centro{max-width:460px;margin:14vh auto;text-align:center;padding:0 20px}
  .centro h1{font-size:22px;margin:0 0 8px}
  .centro p{color:#666;font-size:15px}
  input[type=text]{width:100%;padding:15px;border:1.5px solid #ddd;border-radius:12px;
                   font-size:26px;font-family:ui-monospace,Menlo,monospace;text-align:center;
                   letter-spacing:8px;text-transform:uppercase;margin:14px 0}
  .btn{display:block;width:100%;padding:16px;border:0;border-radius:14px;background:#111;color:#fff;
       font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
  /* oscillazione-esito-v1 — la schermata di fine, uguale a quella del telefono */
  .esito{max-width:1100px;margin:0 auto;padding:0 18px 26px;display:none}
  .esito.on{display:block}
  .carico{border:2px solid;border-radius:20px;padding:18px;text-align:center;margin-bottom:14px}
  .carico .tit{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;opacity:.75;font-weight:700}
  .carico .val{font-size:44px;font-weight:800;line-height:1.15;margin:2px 0}
  .carico .sec{font-size:14px;opacity:.85}
  .tiles{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .tiles>div{flex:1 1 150px;border:1px solid #eee;border-radius:14px;padding:11px;text-align:center;background:#fff}
  .tiles b{display:block;font-size:23px;font-weight:800}
  .tiles span{font-size:11px;color:#888}
  .titolo-omini{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:#888;
                font-weight:700;margin:2px 0 6px}
  .omini{display:flex;gap:8px;margin-bottom:14px}
  .omino{flex:1;border:1px solid #eee;border-radius:14px;padding:8px 4px;text-align:center;background:#fff}
  .cap{font-size:12px;color:#666;letter-spacing:.5px;margin-top:4px}
  .cap-num{font-size:19px;font-weight:800;margin-top:2px}
  .cap-min{font-size:11px;color:#999}
  .frasi{background:#f4f7ff;border:1px solid #d6e0fb;border-radius:14px;padding:14px 16px;
         font-size:15px;line-height:1.6;display:none}
  .esito .frasi{background:#fffdf2;border:0;border-left:5px solid #FFD008;font-size:clamp(16px,1.6vw,22px);color:#111}
  .frasi.on{display:block}
  .frasi p{margin:0 0 8px}
  .frasi p:last-child{margin:0;color:#667;font-style:italic}
  .err{background:#fff5f5;border:1.5px solid #e11;border-radius:12px;padding:11px 13px;
       font-size:14px;color:#900;margin-top:12px}
  /* live-tv-v1 — SCHERMO GRANDE: fondo scuro, il gomitolo come una lavagna
     luminosa, il marchio in alto e il tempo che scorre grande. Si legge da
     tre metri, su una TV come su un computer. */
  body{background:radial-gradient(1200px 700px at 50% 35%,#1b1b1b 0%,#070707 70%);color:#fff;min-height:100vh}
  .barra{background:rgba(0,0,0,.55);border-bottom:1px solid #222;backdrop-filter:blur(6px)}
  .marchio{display:inline-block;background:#FFD008;color:#000;font-weight:900;font-size:11px;letter-spacing:2.5px;
           padding:4px 9px;border-radius:5px;margin-right:10px;vertical-align:middle}
  .tit{font-size:20px;color:#fff}
  .sub{color:#aaa;font-size:13px}
  .stato{background:#1d1d1d;color:#bbb}
  .stato.attesa{background:#1d1d1d;color:#bbb}
  .stato.viva{background:#0f2a1c;color:#6ee7a8}
  .stato.rotta{background:#2a1111;color:#ff9c9c}
  canvas{border:0;box-shadow:0 0 0 1px rgba(255,208,8,.25),0 30px 90px rgba(0,0,0,.6),0 0 70px rgba(255,208,8,.08)}
  .tempo{position:fixed;right:28px;top:76px;font-size:min(12vh,110px);font-weight:900;color:#FFD008;
         font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 6px 30px rgba(0,0,0,.6);display:none}
  .tempo small{display:block;font-size:14px;letter-spacing:2px;color:#aaa;text-align:right;font-weight:700}
  .tempo.on{display:block}
  .esito{color:#111}
  .titolo-omini{color:#bbb}
  .sw{background:#1a1a1a;border-color:#333;color:#eee}
  .intero{position:fixed;left:20px;top:80px;bottom:auto}
  .centro{color:#fff}.centro p{color:#bbb}
  .numeri{color:#111}
</style>
</head>
<body>

<div id="app-ingresso" class="centro" style="display:none">
  <h1>Vista in diretta</h1>
  <p id="ing-testo">Scrivi il codice che ti ha dato il professionista.</p>
  <input type="text" id="cod" maxlength="7" placeholder="ABC123" autocomplete="off"
         autocapitalize="characters" spellcheck="false">
  <button class="btn" id="btn-guarda">Guarda</button>
  <div class="err" id="ing-err" style="display:none"></div>
</div>

<div id="app-visore" style="display:none">
  <div class="barra">
    <div>
      <div class="tit"><span class="marchio">POLICETTIVO®</span>Oscillazione Policettiva</div>
      <div class="sub" id="v-sub">vista in diretta</div>
    </div>
    <div class="stato attesa" id="v-stato">in attesa del telefono…</div>
  </div>
  <div class="scena" id="v-scena"><canvas id="v-canvas" width="900" height="900"></canvas></div>
  <div class="esito" id="v-esito">
    <div class="scena" style="min-height:0;padding:0 0 16px">
      <canvas id="v-canvas2" width="900" height="900" style="width:min(52vh,64vw);height:min(52vh,64vw)"></canvas>
    </div>
    <div id="v-carico"></div>
    <div id="v-tiles"></div>
    <div id="v-omini"></div>
    <button class="sw" id="btn-frasi" style="position:static;width:100%;margin-bottom:12px">Leggi la spiegazione</button>
    <div class="frasi" id="v-frasi"></div>
  </div>
  <div class="tempo" id="v-tempo"></div>
  <button class="sw intero" id="btn-intero">⛶ Schermo intero</button>
  <button class="sw" id="btn-numeri">Mostra i numeri</button>
  <div class="numeri" id="v-numeri"></div>
</div>

<script>
(function(){
  'use strict'
  var SB_URL = 'https://kazlnoikvwdqwvxtigej.supabase.co'
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imthemxub2lrdndkcXd2eHRpZ2VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NTM1MDEsImV4cCI6MjA5MzEyOTUwMX0.gCclWImW4SnIBcsNfFAW0KNtimEw6iiEiLnXbgC96mE'
  var SILENZIO_MS = 3000        // oltre, la diretta si considera interrotta

  var P = window.PolOscillazione
  var $ = function(id){ return document.getElementById(id) }
  var SB = null, sub = null
  var xs = [], ys = [], scala = 3, soglia = 0, inCorso = false
  var ultimoDato = 0, guardia = null, mostraNumeri = false, ultimoFine = null
  var canaleOra = null, cerca = null, fineTempo = 0, orologio = null   // live-tv-v1
  function tempo(){
    var el = $('v-tempo'), rest = Math.ceil((fineTempo - Date.now()) / 1000)
    if (!inCorso || !fineTempo || rest < 0){ el.classList.remove('on'); return }
    el.innerHTML = rest + '<small>SECONDI</small>'; el.classList.add('on')
  }

  function stato(testo, classe){
    var el = $('v-stato'); el.textContent = testo
    el.className = 'stato ' + (classe || 'attesa')
  }
  function ridisegna(){
    var m = null
    P.disegna($('v-canvas'), xs, ys, scala, m, { parole: true, soglia: soglia, cuneo: false })
  }
  function numeri(f){
    ultimoFine = f
    if (!f){ $('v-numeri').innerHTML = ''; return }
    var r = [
      ['⭐ Velocità media', f.velocita + ' °/s'],
      ['Carico', (f.parola || '') + ' ' + Math.abs(f.carico || 0) + '°'],
      ['Osc. avanti-dietro', f.osc_ap + '°'],
      ['Osc. destra-sinistra', f.osc_ds + '°'],
      ['Ellisse 95%', f.ellisse + ' °²'],
      ['Deriva', f.deriva + '°'],
      ['Oscillazioni', f.cicli]
    ]
    $('v-numeri').innerHTML = r.map(function(x){
      return '<div class="nr"><span>' + x[0] + '</span><b>' + x[1] + '</b></div>' }).join('')
  }

  // ═══ oscillazione-esito-v1 · LA SCHERMATA DI FINE ════════════════════
  // Stessa schermata del telefono: il carico grande, i tre omini, quattro
  // numeri e la spiegazione.
  // ⚠️ Il computer NON ricalcola e NON chiede niente al database: disegna
  //    quello che è arrivato nel messaggio di fine. Un pezzo in meno che si
  //    possa inceppare, e nessuna possibilità che i due schermi dicano due
  //    cose diverse.
  // ⚠️ Se il messaggio di fine NON arriva (telefono bloccato), non succede
  //    niente: resta il disegno e il cane da guardia dice che si è interrotta.
  function nascondiEsito(){
    $('v-esito').classList.remove('on')
    $('v-scena').style.display = ''
    $('v-frasi').classList.remove('on')
    $('btn-frasi').textContent = 'Leggi la spiegazione'
  }
  function mostraEsito(f){
    if (!f){ nascondiEsito(); return }
    var col = f.colore || '#555'
    var chiaro = col === '#0a7d33' ? '#eef9f0' : (col === '#c0392b' ? '#fff3f2'
                : (col === '#b07500' ? '#fff8e6' : '#f6f6f6'))
    $('v-scena').style.display = 'none'
    $('v-esito').classList.add('on')

    // lo stesso gomitolo, più piccolo, sopra al risultato
    P.disegna($('v-canvas2'), xs, ys, scala, null, { parole: true, soglia: f.soglia || 0, cuneo: false })

    var secondo = f.asse === 'gamma' ? f.carico_avanti : f.carico_destra
    var parolaSec = f.asse === 'gamma'
      ? (secondo >= 0 ? 'avanti' : 'indietro')
      : (secondo >= 0 ? 'a destra' : 'a sinistra')
    $('v-carico').innerHTML =
      '<div class="carico" style="border-color:' + col + ';background:' + chiaro + ';color:' + col + '">' +
        '<div class="tit">carico medio · ' + (f.evento || '') +
          (f.occhi && f.occhi !== '-' ? ' · occhi ' + f.occhi : '') + '</div>' +
        '<div class="val">' + (f.parola || '') + ' ' + Math.abs(f.carico == null ? 0 : f.carico) + '°</div>' +
        '<div class="sec">e ' + parolaSec + ' di ' + Math.abs(secondo || 0) + '°</div>' +
      '</div>'

    $('v-tiles').innerHTML = '<div class="tiles">' +
      '<div style="border-color:#0a7d33"><b>' + f.velocita + ' °/s</b><span>velocità media ⭐</span></div>' +
      '<div><b>' + f.osc_ap + '°</b><span>oscillazione avanti-dietro</span></div>' +
      '<div><b>' + f.osc_ds + '°</b><span>oscillazione destra-sinistra</span></div>' +
      '<div><b>' + f.cicli + '</b><span>oscillazioni sull’asse del test</span></div>' +
      '<div><b>' + f.deriva + '°</b><span>deriva del carico</span></div>' +
      '</div>'

    $('v-omini').innerHTML = P.omini(f.carico_avanti || 0, f.carico_destra || 0, col, f.soglia || 0)
    // live-tv-v1 · sullo schermo grande le parole per il PAZIENTE, subito visibili
    // (le stesse del PDF), calcolate da quello che è arrivato: niente database.
    var frasi = (P.spiegaPaziente ? P.spiegaPaziente({ evento: f.evento, occhi: f.occhi, carico_avanti: f.carico_avanti,
      carico_destra: f.carico_destra, velocita: f.velocita, serie: { xs: xs, ys: ys } }) : (f.frasi || []))
    $('v-frasi').innerHTML = frasi.map(function(t){ return '<p>' + String(t).replace(/[&<>]/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;' }[c] }) + '</p>' }).join('')
    $('v-frasi').classList.add('on')
    $('btn-frasi').textContent = 'Nascondi la spiegazione'
    $('btn-frasi').style.display = frasi.length ? '' : 'none'
  }

  function ascolta(canale){
    $('app-ingresso').style.display = 'none'
    $('app-visore').style.display = ''
    ridisegna()
    // live-tv-v1 · se il telefono ha aperto un canale nuovo si passa a quello, da soli
    if (sub){ try { SB.removeChannel(sub) } catch(e){} }
    canaleOra = canale
    sub = SB.channel('oscillazione:' + canale, { config: { broadcast: { self: false } } })
    sub.on('broadcast', { event: 'via' }, function(m){
      var p = m.payload || {}
      xs = []; ys = []; scala = 3; inCorso = true
      soglia = p.soglia || 0
      fineTempo = p.durata ? Date.now() + p.durata * 1000 : 0; tempo()
      ultimoDato = Date.now()
      $('v-sub').textContent = (p.evento || '') + (p.occhi && p.occhi !== '-' ? ' · occhi ' + p.occhi : '')
      stato('misura in corso', 'viva')
      numeri(null)
      nascondiEsito()
      ridisegna()
    })
    sub.on('broadcast', { event: 'punti' }, function(m){
      var p = m.payload || {}, i
      if (!p.x) return
      ultimoDato = Date.now()
      if (!inCorso){ inCorso = true; stato('misura in corso', 'viva') }
      for (i = 0; i < p.x.length; i++){
        xs.push(p.x[i]); ys.push(p.y[i])
        scala = Math.max(scala, Math.abs(p.x[i]), Math.abs(p.y[i]))
      }
      ridisegna()
    })
    sub.on('broadcast', { event: 'fine' }, function(m){
      inCorso = false; tempo()
      stato('finito', 'viva')
      numeri(m.payload || null)
      if (mostraNumeri) $('v-numeri').classList.add('on')
      ridisegna()
      mostraEsito(m.payload || null)
    })
    sub.subscribe(function(st){
      if (st === 'SUBSCRIBED') stato('in attesa del telefono…', 'attesa')
      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') stato('collegamento non riuscito', 'rotta')
    })

    if (!orologio) orologio = setInterval(tempo, 250)
    // ⚠️ il cane da guardia: un disegno fermo che sembra vivo inganna
    if (guardia) clearInterval(guardia)
    guardia = setInterval(function(){
      if (inCorso && Date.now() - ultimoDato > SILENZIO_MS){
        inCorso = false
        stato('diretta interrotta — guarda il telefono', 'rotta')
      }
    }, 700)
  }

  function errore(t){ var e = $('ing-err'); e.textContent = t; e.style.display = '' }

  async function conCodice(cod){
    var r = await SB.rpc('oscillazione_risolvi', { p_codice: cod })
    if (r.error || !r.data){ errore('Codice non valido o scaduto. Fattene dare uno nuovo.'); return }
    ascolta(r.data)
  }

  async function avvia(){
    if (!window.supabase || !window.supabase.createClient){
      $('app-ingresso').style.display = ''
      errore('Questa pagina non è riuscita a caricare le sue librerie. Controlla la rete.')
      return
    }
    SB = window.supabase.createClient(SB_URL, SB_KEY)
    var cod = new URLSearchParams(location.search).get('c')
    if (cod){ $('app-ingresso').style.display = ''; $('cod').value = cod.toUpperCase(); await conCodice(cod); return }

    var ses = null
    try { var r = await SB.auth.getSession(); ses = r && r.data ? r.data.session : null } catch(e){}
    if (ses){
      var c = await SB.rpc('oscillazione_canale')
      // live-tv-v1 · col proprio account la pagina CERCA da sola il telefono: appena
      // la diretta si accende (o cambia canale) si aggancia, senza ricaricare.
      cerca = setInterval(async function(){
        if (inCorso) return
        try {
          var n = await SB.rpc('oscillazione_canale')
          if (!n.error && n.data && n.data !== canaleOra) ascolta(n.data)
        } catch(e){}
      }, 4000)
      if (!c.error && c.data){ ascolta(c.data); return }
      $('app-ingresso').style.display = ''
      $('ing-testo').textContent = 'Sul telefono, nella pagina del test, accendi «Mostra sul computer»: ' +
        'questa pagina si collega da sola. Oppure scrivi qui un codice ospite.'
      return
    }
    $('app-ingresso').style.display = ''
  }

  $('btn-guarda').addEventListener('click', function(){
    $('ing-err').style.display = 'none'
    var c = ($('cod').value || '').trim()
    if (c.length < 6){ errore('Il codice è di sei caratteri.'); return }
    conCodice(c)
  })
  $('cod').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('btn-guarda').click() })
  $('btn-frasi').addEventListener('click', function(){
    var on = $('v-frasi').classList.toggle('on')
    $('btn-frasi').textContent = on ? 'Nascondi la spiegazione' : 'Leggi la spiegazione'
  })
  $('btn-intero').addEventListener('click', function(){
    try {
      if (document.fullscreenElement) document.exitFullscreen()
      else document.documentElement.requestFullscreen()
    } catch(e){}
  })
  $('btn-numeri').addEventListener('click', function(){
    mostraNumeri = !mostraNumeri
    $('v-numeri').classList.toggle('on', mostraNumeri && !!ultimoFine)
    $('btn-numeri').textContent = mostraNumeri ? 'Nascondi i numeri' : 'Mostra i numeri'
  })

  avvia()

  window.__live = {
    stato: function(){ return { xs: xs, ys: ys, inCorso: inCorso, scala: scala, fine: ultimoFine } },
    ascolta: ascolta,
    silenzio: SILENZIO_MS,
    esito: function(){ return $('v-esito').classList.contains('on') }
  }
})()
</script>
</body>
</html>
