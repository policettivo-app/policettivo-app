<!DOCTYPE html>

  <title>Cartella Clinica — Policettivo®</title>
  <link rel="stylesheet" href="css/design-system.css">
  <script>
    const params = new URLSearchParams(window.location.search);
    const patientId = params.get('id') || params.get('pid');
    if (patientId) {
      window.location.replace('paziente.html?id=' + patientId + '#cartella-clinica');
    } else {
      window.location.replace('dashboard.html');
    }
  </script>

    body { font-family: 'Montserrat', sans-serif; background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    p { color: #888; font-size: 14px; }
  </style>
</head>
