body { font-family: 'Montserrat', sans-serif; background: #000; color: #fff; min-height: 100vh; }

<script>

const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imthemxub2lrdndkcXd2eHRpZ2VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NTM1MDEsImV4cCI6MjA5MzEyOTUwMX0.gCclWImW4SnIBcsNfFAW0KNtimEw6iiEiLnXbgC96mE'
const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
const params = new URLSearchParams(window.location.search)
const token = params.get('token')
const isPreview = new URLSearchParams(location.search).get('preview') === '1'
if (isPreview) {
  document.addEventListener('DOMContentLoaded', function() {
    const bar = document.createElement('div')
    bar.textContent = '👁 ANTEPRIMA PROFESSIONISTA — nessun dato viene salvato'

    document.body.appendChild(bar)
    document.body.style.paddingTop = '36px'
  })
}
let patient = null, protocol = null, exercises = []
let checkedItems = new Set()
let timers = {}

const frasi = [
  'Ogni sessione completata e una promessa mantenuta a te stesso.',
  'Non serve fare tutto perfettamente. Serve farlo con intenzione.',
  'Il corpo che vuoi e esattamente quello che stai costruendo adesso.',
  'La costanza non chiede la perfezione. Chiede solo che tu ci sia.',
  'Anche oggi hai scelto di muoverti. Questa e la differenza.'
]

function torna() { window.location.href = 'protocollo.html?token=' + token + (isPreview ? '&preview=1' : '') }

function updateSlider(id, val) {
  document.getElementById('val-' + id).textContent = val
}

async function init() {
  if (!token) { torna(); return }
  const { data: pd, error: pdErr } = await _supabase.rpc('get_protocol_data', { p_token: token })
  if (pdErr || !pd || !pd.patient) { torna(); return }
  patient = pd.patient
  if (!pd.protocol || pd.protocol.stato !== 'attivo') { torna(); return }
  protocol = pd.protocol
  // rapida-video-v1 : ogni esercizio si porta dietro il suo video. Prima la
  // modalita' rapida lo buttava via, e chi non ricordava un esercizio doveva
  // uscire e cambiare modalita' - cioe' perdere il punto della modalita' rapida.
  const _std = (pd.exercises || []).map(function(item){ const ex = item.exercise || null; const ppe = item.ppe || {}; return { name: ex ? ex.nome : 'Esercizio', durata: ppe.durata || (ex ? ex.durata_default : 90) || 90, video: videoDa(ex ? ex.video_url : null) } })
  const _eli = (pd.elicoidali || []).map(function(e){ const def = (typeof EXERCISES_ELICOIDALI !== 'undefined') ? EXERCISES_ELICOIDALI.find(function(x){ return x.id === e.elicoidale_id }) : null; return { name: def ? def.title : e.elicoidale_id, durata: e.durata || 60, video: videoDa(e.video_url || (def ? def.video_url : null)) } })
  const _cust = (pd.custom_videos || []).map(function(v){ return { name: v.titolo || 'Contenuto personalizzato', durata: v.durata || 60, video: v.url ? { tipo: (v.tipo === 'foto' ? 'foto' : 'file'), url: v.url } : null } })
  exercises = _std.concat(_eli).concat(_cust)
  // daily-context-v1 : la seduta comincia adesso, non quando premera' Salva.
  try { polSessione.avvia() } catch (e) {}
  renderExercises()
}

/* rapida-video-v1 — riconosce che tipo di video e', una volta sola al
   caricamento, cosi' il disegno della lista non deve ragionarci ogni volta.
   Le stesse forme gestite dalla modalita' guidata: YouTube normale, YouTube
   Shorts, e i link di ricerca che non si possono incorporare. */
function videoDa(url) {
  if (!url) return null
  if (url.indexOf('youtube.com/results') !== -1) return { tipo: 'link', url: url }
  var shorts = url.match(/youtube\.com\/shorts\/([^?&\n]+)/)
  if (shorts) return { tipo: 'youtube', id: shorts[1], shorts: true, url: url }
  var normale = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\n?#]+)/)
  if (normale) return { tipo: 'youtube', id: normale[1], shorts: false, url: url }
  return { tipo: 'link', url: url }
}

function apriVideo(i) {
  var e = exercises[i]; if (!e || !e.video) return
  var v = e.video
  try { polEvento('exercise_video_opened', { modalita: 'rapid', n: i + 1 }) } catch (err) {}
  document.getElementById('vm-titolo').textContent = e.name || ('Esercizio ' + (i + 1))
  var media = document.getElementById('vm-media')
  media.className = 'vm-media' + (v.tipo === 'youtube' && v.shorts ? ' shorts' : '')
  if (v.tipo === 'youtube') {
    media.innerHTML = '<iframe src="https://www.youtube.com/embed/' + v.id + '?playsinline=1&rel=0" allowfullscreen allow="autoplay"></iframe>'
  } else if (v.tipo === 'foto') {
    media.innerHTML = '<img src="' + v.url + '" alt="">'
  } else if (v.tipo === 'file') {
    media.innerHTML = '<video src="' + v.url + '" controls playsinline preload="metadata"></video>'
  } else {
    media.innerHTML = '<div style="padding:40px 20px;text-align:center;color:#aaa;font-size:14px">' +
      'Questo video si apre su YouTube.<br><br>' +
      '<a href="' + v.url + '" target="_blank" rel="noopener" style="background:#FF0000;color:#fff;padding:12px 22px;border-radius:10px;text-decoration:none;font-weight:700;display:inline-block">Guarda su YouTube</a></div>'
  }
  document.getElementById('video-modal').classList.add('open')
}

// Chiudendo si svuota il riquadro: altrimenti l'audio di YouTube continuerebbe
// a suonare dietro la lista.
function chiudiVideo() {
  document.getElementById('vm-media').innerHTML = ''
  document.getElementById('video-modal').classList.remove('open')
}

function renderExercises() {
  const list = document.getElementById('exercise-list')
  if (!exercises.length) { list.innerHTML = '<div style="color:#555;font-size:13px">Nessun esercizio</div>'; return }
  list.innerHTML = exercises.map((e, i) => {
    const durata = e.durata || 90
    const nome = e.name || ('Esercizio ' + (i+1))
    const isDone = checkedItems.has(i)
    return '<div class="ex-item' + (isDone ? ' done' : '') + '" id="ex-item-' + i + '">' +
      '<div class="ex-check" id="chk-' + i + '" onclick="toggleCheck(' + i + ')">' + (isDone ? '✓' : '') + '</div>' +
      '<div class="ex-info">' +
        '<div class="ex-name">' + nome + '</div>' +
        '<div class="ex-meta">' + durata + ' sec</div>' +
        '<div class="timer-mini" id="timer-' + i + '"></div>' +
      '</div>' +
      '<div class="ex-actions">' +
        (e.video
          ? '<button class="ex-btn ex-btn-video" onclick="apriVideo(' + i + ')" aria-label="Guarda il video di ' + nome.replace(/"/g, '') + '">' +
              '<span class="ic">▶</span>Video</button>'
          : '') +
        '<button class="ex-btn ex-btn-timer' + (timers[i] && timers[i].running ? ' running' : '') + '" id="tbtn-' + i + '" onclick="toggleTimer(' + i + ',' + durata + ')">' +
          '<span class="ic">' + (timers[i] && timers[i].running ? '⏸' : '⏱') + '</span>' +
          (timers[i] && timers[i].running ? 'Pausa' : 'Timer') +
        '</button>' +
      '</div>' +
    '</div>'
  }).join('')
}

function toggleCheck(i) {
  if (checkedItems.has(i)) checkedItems.delete(i)
  else { checkedItems.add(i); try{polEvento('exercise_completed',{modalita:'rapid',n:i+1})}catch(e){} }
  renderExercises()
}

function toggleTimer(i, durata) {
  if (!timers[i]) timers[i] = { remaining: durata, running: false, interval: null }
  const t = timers[i]
  if (t.running) {
    clearInterval(t.interval)
    t.running = false
  } else {
    t.running = true
    t.interval = setInterval(() => {
      t.remaining--
      const el = document.getElementById('timer-' + i)
      if (el) {
        const m = Math.floor(t.remaining / 60)
        const s = t.remaining % 60
        el.textContent = m + ':' + (s < 10 ? '0' : '') + s
        el.classList.add('visible')
      }
      if (t.remaining <= 0) {
        clearInterval(t.interval)
        t.running = false
        checkedItems.add(i)
        renderExercises()
      }
      // rapida-video-v1 : si aggiorna il CONTENUTO del pulsante, non lo si
      // svuota. La riga di prima faceva `btn.textContent = '⏸'` ogni secondo e
      // avrebbe cancellato icona + parola, lasciando un simbolo nudo.
      const btn = document.getElementById('tbtn-' + i)
      if (btn) {
        btn.innerHTML = '<span class="ic">' + (t.running ? '⏸' : '⏱') + '</span>' + (t.running ? 'Pausa' : 'Timer')
        btn.classList.toggle('running', t.running)
      }
    }, 1000)
  }
  renderExercises()
}

function eseguitiText() {
  const done = exercises.filter(function(_, i){ return checkedItems.has(i) }).map(function(e){ return e.name })
  return done.length ? ('Esercizi eseguiti: ' + done.join(', ')) : 'Seduta rapida completata (nessun esercizio spuntato)'
}

async function completaSeduta() {
  const dolore = parseInt(document.getElementById('sl-dolore').value)
  const energia = parseInt(document.getElementById('sl-energia').value)
  const note = document.getElementById('note').value.trim()
  const today = new Date().toISOString().split('T')[0]
  const eseguiti = eseguitiText()
  const noteFinale = eseguiti + (note ? ('. Note: ' + note) : '')
  if (isPreview) { mostraCompletato(true); return }
  // daily-context-v1 : i campi della seduta li prepara js/pol-sessione.js,
  // un punto solo per tutte e tre le pagine.
  const eseguitiNomi = exercises.filter(function(_, i){ return checkedItems.has(i) }).map(function(e){ return e.name })
  await _supabase.rpc('save_diary_entry', { p_token: token, p_data: Object.assign({
    patient_protocol_id: protocol.id, data: today,
    dolore, rigidita: 0, equilibrio: 5, energia,
    note: noteFinale, completato: true, session_type: 'main'
  }, polSessione.campi('rapid', { esercizi_completati: eseguitiNomi })) })
  try{polEvento('session_completed',{modalita:'rapid'})}catch(e){}
  try{polSessione.chiudi()}catch(e){}
  mostraCompletato()
}

async function saltaECompleta() {
  const today = new Date().toISOString().split('T')[0]
  if (isPreview) { mostraCompletato(true); return }
  // daily-context-v1 : «salta tutto e segna come completato» si registra
  // come 'manual', che e' quello che e'. Finora finiva nel mucchio delle
  // sedute fatte ed e' il motivo per cui l'aderenza era piu' bella del vero.
  await _supabase.rpc('save_diary_entry', { p_token: token, p_data: Object.assign({
    patient_protocol_id: protocol.id, data: today,
    dolore: 0, rigidita: 0, equilibrio: 5, energia: 5,
    note: eseguitiText(), completato: true, session_type: 'main'
  }, polSessione.campi('manual')) })
  try{polEvento('session_completed',{modalita:'manual'})}catch(e){}
  try{polSessione.chiudi()}catch(e){}
  mostraCompletato()
}

/* rapida-un-click-v1 [video-guida-v1] — LA RAPIDA DEVE COSTARE UN CLICK, NON DUE.
   Prima: «Completa seduta» apriva questa schermata e poi bisognava
   premere «Torna al protocollo». Due tocchi per finire una modalita'
   che esiste apposta per essere veloce. Adesso torna da sola dopo
   2,5 secondi - il tempo di vedere il trofeo e leggere la frase, che
   restano: quella e' la ricompensa, toglierla sarebbe togliere
   qualcosa. Il pulsante resta li' per chi non vuole aspettare.

   In ANTEPRIMA non torna da sola (il professionista sta guardando) e
   al posto dell'avviso che bloccava a meta' si vede la stessa
   schermata del paziente, con scritto come uscire dall'anteprima.
   Prima un alert fermava la prova e non diceva come proseguire: ci e'
   cascato anche chi l'app l'ha fatta. */
let tornaSolo = null
function mostraCompletato(anteprima) {
  const frase = frasi[Math.floor(Math.random() * frasi.length)]
  document.getElementById('motivational-msg').textContent = frase
  const sub = document.getElementById('completed-sub')
  if (anteprima) {
    sub.innerHTML = 'ANTEPRIMA &mdash; niente e stato salvato.<br>' +
      '<span style="font-size:12px;opacity:.8">Togli <b>&amp;preview=1</b> dal link per provare davvero.</span>'
  } else {
    sub.textContent = 'Seduta registrata con successo'
  }
  document.getElementById('completed-overlay').classList.add('show')
  try {
    const audio = new Audio('magnific_epic-victory.mp3')
    audio.volume = 0.7
    audio.play()
  } catch(e) {}
  if (!anteprima) {
    if (tornaSolo) clearTimeout(tornaSolo)
    tornaSolo = setTimeout(torna, 2500)
  }
}

init()
</script>
