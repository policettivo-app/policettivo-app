<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Policettivo® — Imposta nuova password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:#000; display:flex; align-items:center; justify-content:center; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; padding:20px; }
    .card { background:#fff; border-radius:24px; padding:40px 32px; max-width:420px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.4); }
    .logo { display:inline-block; background:#F5C518; font-weight:800; letter-spacing:1px; padding:8px 18px; border-radius:8px; font-size:14px; }
    h1 { font-size:26px; margin:18px 0 4px; }
    .sub { color:#666; font-size:15px; margin-bottom:24px; }
    label { display:block; font-weight:700; font-size:13px; letter-spacing:.5px; margin:18px 0 6px; }
    input { width:100%; padding:14px 16px; border:1px solid #ddd; border-radius:12px; font-size:16px; background:#eef0fb; }
    button { width:100%; margin-top:24px; padding:16px; border:none; border-radius:12px; background:#F5C518; font-weight:800; font-size:16px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    .msg { margin-top:16px; font-size:14px; display:none; padding:12px 14px; border-radius:10px; }
    .msg.err { display:block; background:#fdecec; color:#b00020; }
    .msg.ok { display:block; background:#eafaef; color:#0a7a33; }
    .center { text-align:center; }
    a { color:#444; font-size:14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="center"><span class="logo">POLICETTIVO®</span></div>
    <h1>Nuova password</h1>
    <div class="sub">Scegli una nuova password per il tuo account.</div>

    <div id="form-area" style="display:none">
      <label for="pwd">NUOVA PASSWORD</label>
      <input id="pwd" type="password" autocomplete="new-password" placeholder="Almeno 8 caratteri" />
      <label for="pwd2">CONFERMA PASSWORD</label>
      <input id="pwd2" type="password" autocomplete="new-password" placeholder="Ripeti la password" />
      <button id="save-btn" onclick="doReset()">Salva nuova password</button>
    </div>

    <div id="wait" class="center" style="color:#666;font-size:15px;">Verifica del link in corso…</div>
    <div id="msg" class="msg"></div>
    <div class="center" style="margin-top:18px"><a href="login.html">← Torna al login</a></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://kazlnoikvwdqwvxtigej.supabase.co'
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imthemxub2lrdndkcXd2eHRpZ2VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NTM1MDEsImV4cCI6MjA5MzEyOTUwMX0.gCclWImW4SnIBcsNfFAW0KNtimEw6iiEiLnXbgC96mE'
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    let canReset = false

    function show(type, text) {
      const m = document.getElementById('msg')
      m.className = 'msg ' + type
      m.textContent = text
    }
    function revealForm() {
      canReset = true
      document.getElementById('wait').style.display = 'none'
      document.getElementById('form-area').style.display = 'block'
    }

    _supabase.auth.onAuthStateChange(function (event, session) {
      if (event === 'PASSWORD_RECOVERY') revealForm()
      else if (session) revealForm()
    })

    window.addEventListener('load', async function () {
      const hash = window.location.hash || ''
      if (hash.indexOf('error') !== -1) {
        document.getElementById('wait').style.display = 'none'
        show('err', 'Link scaduto o non valido. Richiedi un nuovo reset dalla pagina di login.')
        return
      }
      const { data } = await _supabase.auth.getSession()
      if (data && data.session) revealForm()
      else {
        setTimeout(async function () {
          const r = await _supabase.auth.getSession()
          if (r.data && r.data.session) revealForm()
          else {
            document.getElementById('wait').style.display = 'none'
            show('err', 'Link non valido o già usato. Richiedi un nuovo reset dalla pagina di login.')
          }
        }, 1500)
      }
    })

    async function doReset() {
      if (!canReset) return
      const p1 = document.getElementById('pwd').value
      const p2 = document.getElementById('pwd2').value
      const btn = document.getElementById('save-btn')
      if (p1.length < 8) { show('err', 'La password deve avere almeno 8 caratteri.'); return }
      if (p1 !== p2) { show('err', 'Le due password non coincidono.'); return }
      btn.disabled = true; btn.textContent = 'Salvataggio…'
      const { error } = await _supabase.auth.updateUser({ password: p1 })
      if (error) {
        show('err', 'Errore: ' + error.message)
        btn.disabled = false; btn.textContent = 'Salva nuova password'
        return
      }
      document.getElementById('form-area').style.display = 'none'
      show('ok', '✅ Password aggiornata. Reindirizzamento al login…')
      setTimeout(function () { window.location.href = 'login.html' }, 2000)
    }
  </script>
</body>
</html>
