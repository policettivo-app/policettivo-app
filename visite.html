<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Visite — Policettivo</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #000; color: #fff; font-family: 'Montserrat', sans-serif; min-height: 100dvh; padding-bottom: 24px; }

    /* ── Navbar ── */
    .navbar {
      position: sticky; top: 0; background: #000; border-bottom: 1px solid #1a1a1a;
      padding: 0 16px; height: 52px; display: flex; align-items: center; gap: 12px; z-index: 100;
    }
    .btn-back { background: none; border: none; color: #FFD008; font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; padding: 0; flex-shrink: 0; }
    .nav-title { flex: 1; color: #fff; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn-add { background: #FFD008; color: #000; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 22px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; line-height: 1; }

    /* ── Timeline ── */
    .timeline { padding: 20px 16px; max-width: 600px; margin: 0 auto; }
    .timeline-empty { padding: 8px 0 24px; }
    .empty-patient-name { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 16px; }
    .empty-notes-card { background: #111; border: 1px solid #1e1e1e; border-radius: 14px; padding: 16px; margin-bottom: 20px; }
    .empty-notes-title { font-size: 11px; font-weight: 700; color: #FFD008; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; }
    .empty-notes-text { font-size: 13px; color: #ccc; line-height: 1.6; white-space: pre-wrap; }
    .btn-prima-visita { width: 100%; background: #111; border: 1.5px solid #FFD008; color: #fff; border-radius: 12px; padding: 16px; font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; text-align: center; display: block; }
    .empty-cta-desc { font-size: 12px; color: #555; text-align: center; margin-top: 10px; line-height: 1.5; }

    .visit-card { background: #111; border: 1px solid #1e1e1e; border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
    .visit-header { padding: 14px 16px; cursor: pointer; display: flex; align-items: flex-start; gap: 14px; }
    .visit-date-col { flex-shrink: 0; text-align: center; min-width: 52px; }
    .visit-day { font-size: 30px; font-weight: 700; line-height: 1; }
    .visit-month { font-size: 10px; color: #888; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .visit-year { font-size: 10px; color: #555; font-weight: 600; }
    .visit-divider { width: 1px; background: #2a2a2a; align-self: stretch; flex-shrink: 0; }
    .visit-main { flex: 1; min-width: 0; }
    .visit-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 7px; }
    .badge { font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: 20px; letter-spacing: 0.5px; }
    .badge-prima { background: #FFD008; color: #000; }
    .badge-controllo { background: #1e1e1e; color: #888; border: 1px solid #333; }
    .badge-npl { background: #000; color: #9AFF00; border: 1px solid #9AFF00; }
    .badge-gpl { background: #9AFF00; color: #000; }
    .visit-note-preview { font-size: 12px; color: #999; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; }
    .visit-thumbs { display: flex; gap: 5px; flex-wrap: wrap; }
    .visit-thumb { width: 60px; height: 76px; border-radius: 6px; object-fit: cover; border: 1px solid #2a2a2a; }
    .btn-vedi-dettaglio { background: #FFD008; color: #000; border: none; border-radius: 6px; padding: 6px 14px; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .visit-toggle { flex-shrink: 0; font-size: 12px; color: #555; padding-top: 6px; transition: transform 0.2s; }
    .visit-toggle.open { transform: rotate(180deg); }

    .visit-detail { display: none; border-top: 1px solid #1a1a1a; padding: 16px; }
    .visit-detail.open { display: block; }
    .detail-label { font-size: 10px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; margin-top: 14px; }
    .detail-label:first-child { margin-top: 0; }
    .detail-note { font-size: 13px; color: #ccc; line-height: 1.6; white-space: pre-wrap; }
    .detail-foto-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .detail-foto-box { border-radius: 8px; overflow: hidden; }
    .detail-foto-bar { background: #000; color: #888; font-size: 9px; font-weight: 700; padding: 3px 7px; text-transform: uppercase; letter-spacing: 0.5px; }
    .detail-foto-img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }

    /* ── New Visit Panel ── */
    .nvp {
      position: fixed; inset: 0; background: #000; z-index: 500;
      display: none; flex-direction: column; overflow: hidden;
    }
    .nvp.open { display: flex; }
    .nvp-header {
      background: #000; border-bottom: 1px solid #1a1a1a;
      padding: 0 16px; height: 52px; display: flex; align-items: center; gap: 12px;
      flex-shrink: 0; position: sticky; top: 0; z-index: 10;
    }
    .btn-nvp-cancel { background: none; border: none; color: #888; font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; padding: 0; }
    .nvp-title { flex: 1; font-size: 14px; font-weight: 700; }
    .btn-nvp-save { background: #FFD008; color: #000; border: none; border-radius: 8px; padding: 8px 18px; font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; }
    .nvp-body { flex: 1; overflow-y: auto; padding: 20px 16px; max-width: 600px; margin: 0 auto; width: 100%; }

    .form-group { margin-bottom: 20px; }
    .form-label { font-size: 10px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; display: block; }
    .form-input {
      width: 100%; background: #111; border: 1.5px solid #222; color: #fff;
      border-radius: 10px; padding: 12px 14px; font-family: 'Montserrat', sans-serif; font-size: 14px; outline: none;
    }
    .form-input:focus { border-color: #FFD008; }
    textarea.form-input { resize: none; height: 90px; }
    input[type="date"].form-input::-webkit-calendar-picker-indicator { filter: invert(1) brightness(0.7); }

    .tipo-group { display: flex; gap: 8px; }
    .tipo-btn {
      flex: 1; padding: 10px 6px; border-radius: 8px; border: 1.5px solid #222;
      background: #111; color: #888; font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center;
    }
    .tipo-btn.active { border-color: #FFD008; color: #FFD008; background: #1a1500; }

    .foto-section-label { font-size: 10px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 0.8px; margin-top: 24px; margin-bottom: 12px; }
    .foto-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
    .foto-slot-v {
      border: 2px dashed #222; border-radius: 12px; aspect-ratio: 3/4;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; position: relative; overflow: hidden; background: #111; transition: border-color 0.2s;
    }
    .foto-slot-v:hover { border-color: #FFD008; }
    .foto-slot-v.has-photo { border-style: solid; border-color: #2a2a2a; padding: 0; }
    .foto-slot-v img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .slot-label-v { font-size: 9px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 0.5px; text-align: center; margin-bottom: 5px; }
    .slot-icon-v { font-size: 22px; margin-bottom: 3px; }
    .slot-overlay-v { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.65); text-align: center; font-size: 10px; font-weight: 700; color: #fff; padding: 5px; cursor: pointer; }

    /* AI result */
    .btn-ai-visita {
      width: 100%; padding: 14px; background: #111; border: 1.5px solid #333; border-radius: 12px;
      color: #fff; font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 700;
      cursor: pointer; margin-top: 20px; display: none; text-align: center;
    }
    .btn-ai-visita.visible { display: block; }
    .ai-loading-visita { text-align: center; padding: 16px; color: #aaa; font-size: 13px; display: none; }
    .ai-loading-visita.visible { display: block; }
    .ai-result-box {
      background: #111; border: 1.5px solid #FFD008; border-radius: 12px;
      padding: 16px; margin-top: 12px; display: none;
    }
    .ai-result-box.visible { display: block; }
    .ai-result-text { font-size: 13px; color: #ddd; line-height: 1.6; margin-bottom: 14px; }
    .ai-config-row { display: flex; gap: 8px; }
    .btn-scegli-config { flex: 1; padding: 10px; border-radius: 8px; font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; border: none; }
    .btn-npl { background: #000; color: #9AFF00; border: 1.5px solid #9AFF00 !important; border: none; }
    .btn-gpl { background: #9AFF00; color: #000; }

    /* ── Camera Modal ── */
    #cam-modal { display: none; position: fixed; inset: 0; z-index: 2000; background: #000; }
    #cam-modal.open { display: block; }
    #cam-video { width: 100%; height: 100%; object-fit: cover; display: block; }
    #cam-sagoma-wrap { position: absolute; inset: 0; pointer-events: none; display: none; }
    #cam-sagoma-wrap.visible { display: block; }
    #cam-v-line { position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: rgba(255,255,255,0.5); transform: translateX(-50%); }
    #cam-h-line { position: absolute; top: 35%; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.5); }
    #cam-hint { position: absolute; bottom: 142px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.88); font-size: 11px; font-weight: 700; background: rgba(0,0,0,0.52); border-radius: 20px; padding: 6px 16px; font-family: 'Montserrat', sans-serif; white-space: nowrap; }
    #cam-livella-wrap { position: absolute; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    #cam-livella-inner { width: 100%; transition: transform 0.07s linear; }
    #cam-livella-line { width: 100%; height: 2px; background: #e53935; box-shadow: 0 0 8px rgba(229,57,53,0.7); transition: background 0.2s, box-shadow 0.2s; }
    #cam-livella-testo { text-align: center; margin-top: 8px; font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 700; color: #e53935; text-shadow: 0 1px 5px rgba(0,0,0,0.95); transition: color 0.2s; }
    #cam-debug { position: absolute; top: 76px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.5); font-size: 10px; font-family: monospace; pointer-events: none; }
    #cam-ios-btn { display: none; position: absolute; bottom: 142px; left: 50%; transform: translateX(-50%); background: #FFD008; color: #000; border: none; border-radius: 22px; padding: 10px 20px; font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; z-index: 10; }
    #cam-close-btn { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.55); color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #cam-gallery-btn { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.55); color: #fff; border: none; border-radius: 22px; padding: 10px 16px; font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; }
    #cam-shutter-btn { position: absolute; bottom: 48px; left: 50%; transform: translateX(-50%); width: 76px; height: 76px; border-radius: 50%; background: #fff; border: 5px solid rgba(255,255,255,0.35); cursor: pointer; transition: transform 0.1s, opacity 0.1s; }
    #cam-shutter-btn:active { transform: translateX(-50%) scale(0.9); opacity: 0.75; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <button class="btn-back" id="btn-back">&#x2190; Torna</button>
    <span class="nav-title" id="nav-title">Visite</span>
    <button class="btn-add" onclick="apriNuovaVisita()" title="Aggiungi visita">+</button>
  </div>

  <!-- Timeline -->
  <div class="timeline" id="timeline">
    <div class="timeline-empty" id="timeline-empty" style="display:none"></div>
  </div>

  <!-- ── New Visit Panel ── -->
  <div class="nvp" id="nvp">
    <div class="nvp-header">
      <button class="btn-nvp-cancel" onclick="chiudiNuovaVisita()">Annulla</button>
      <span class="nvp-title" id="nvp-title">Nuova visita</span>
      <button class="btn-nvp-save" onclick="salvaVisita()">Salva</button>
    </div>
    <div class="nvp-body">

      <!-- Data e tipo -->
      <div class="form-group">
        <label class="form-label">Data visita</label>
        <input type="date" id="nv-data" class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label">Tipo visita</label>
        <div class="tipo-group">
          <button class="tipo-btn" id="tipo-prima" onclick="setTipo('prima-visita')">Prima visita</button>
          <button class="tipo-btn active" id="tipo-controllo" onclick="setTipo('controllo')">Controllo</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Note</label>
        <textarea class="form-input" id="nv-note" placeholder="Osservazioni, sintomi, progressi..."></textarea>
      </div>

      <!-- Foto sagittale -->
      <div class="foto-section-label">Piano Sagittale</div>
      <div class="foto-grid-2">
        <div class="foto-slot-v" id="nv-slot-sag-sx" onclick="apriFotoSlot('sag-sx')">
          <div class="slot-label-v">Sinistro</div>
          <div class="slot-icon-v">📷</div>
        </div>
        <div class="foto-slot-v" id="nv-slot-sag-dx" onclick="apriFotoSlot('sag-dx')">
          <div class="slot-label-v">Destro</div>
          <div class="slot-icon-v">📷</div>
        </div>
      </div>

      <!-- Foto frontale -->
      <div class="foto-section-label">Piano Frontale e Posteriore <span style="color:#555;font-size:9px">(facoltativo)</span></div>
      <div class="foto-grid-2">
        <div class="foto-slot-v" id="nv-slot-frontale" onclick="apriFotoSlot('frontale')">
          <div class="slot-label-v">Frontale</div>
          <div class="slot-icon-v">📷</div>
        </div>
        <div class="foto-slot-v" id="nv-slot-posteriore" onclick="apriFotoSlot('posteriore')">
          <div class="slot-label-v">Posteriore</div>
          <div class="slot-icon-v">📷</div>
        </div>
      </div>

      <!-- Foto podoscopica -->
      <div class="foto-section-label">Podoscopica <span style="color:#555;font-size:9px">(facoltativo)</span></div>
      <div class="foto-grid-2">
        <div class="foto-slot-v" id="nv-slot-podo-sotto" onclick="apriFotoSlot('podo-sotto')">
          <div class="slot-label-v">Piede da sotto</div>
          <div class="slot-icon-v">🦶</div>
        </div>
        <div class="foto-slot-v" id="nv-slot-podo-dietro" onclick="apriFotoSlot('podo-dietro')">
          <div class="slot-label-v">Piede da dietro</div>
          <div class="slot-icon-v">🦶</div>
        </div>
      </div>

      <!-- Hidden file inputs -->
      <input type="file" id="nv-input-sag-sx"     accept="image/*" style="display:none" onchange="handleNVFoto('sag-sx',this)">
      <input type="file" id="nv-input-sag-dx"     accept="image/*" style="display:none" onchange="handleNVFoto('sag-dx',this)">
      <input type="file" id="nv-input-frontale"   accept="image/*" style="display:none" onchange="handleNVFoto('frontale',this)">
      <input type="file" id="nv-input-posteriore" accept="image/*" style="display:none" onchange="handleNVFoto('posteriore',this)">
      <input type="file" id="nv-input-podo-sotto" accept="image/*" style="display:none" onchange="handleNVFoto('podo-sotto',this)">
      <input type="file" id="nv-input-podo-dietro" accept="image/*" style="display:none" onchange="handleNVFoto('podo-dietro',this)">

      <!-- AI button (appare dopo le foto sagittali) -->
      <button class="btn-ai-visita" id="btn-ai-visita" onclick="avviaAIVisita()">🤖 Analisi AI — Suggerisci NPL o GPL</button>
      <div class="ai-loading-visita" id="ai-loading-visita">⏳ Analisi in corso...</div>
      <div class="ai-result-box" id="ai-result-box">
        <div class="ai-result-text" id="ai-result-text"></div>
        <div class="ai-config-row">
          <button class="btn-scegli-config btn-npl" onclick="setConfigVisita('NPL')">NPL — Anteriore</button>
          <button class="btn-scegli-config btn-gpl" onclick="setConfigVisita('GPL')">GPL — Posteriore</button>
        </div>
      </div>
      <div style="height:40px"></div>
    </div>
  </div>

  <!-- ── Camera Modal ── -->
  <div id="cam-modal">
    <video id="cam-video" autoplay playsinline muted></video>

    <div id="cam-sagoma-wrap">
      <div id="cam-v-line"></div>
      <div id="cam-h-line"></div>
      <div id="cam-hint">Centra il paziente &bull; distanza 2,5&nbsp;m</div>
    </div>

    <div id="cam-livella-wrap">
      <div id="cam-livella-inner">
        <div id="cam-livella-line"></div>
        <div id="cam-livella-testo">—</div>
      </div>
    </div>

    <div id="cam-debug"></div>
    <button id="cam-ios-btn"></button>
    <button id="cam-close-btn" onclick="chiudiCam()">&#x2715;</button>
    <button id="cam-gallery-btn" onclick="apriGalleriaCam()">&#x1F5BC; Galleria</button>
    <button id="cam-shutter-btn" onclick="scattaCam()"></button>
  </div>

  <script>
    const SUPABASE_URL = 'https://kazlnoikvwdqwvxtigej.supabase.co'
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imthemxub2lrdndkcXd2eHRpZ2VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NTM1MDEsImV4cCI6MjA5MzEyOTUwMX0.gCclWImW4SnIBcsNfFAW0KNtimEw6iiEiLnXbgC96mE'
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    const params    = new URLSearchParams(location.search)
    const patientId = params.get('id')

    let patient      = null
    let visite       = []
    let nvTipo       = 'controllo'
    let nvConfig     = null
    let nvFotos      = {}
    let _camStream   = null
    let _camSlot     = null
    let _orientHdlr  = null

    // ── Init ──────────────────────────────────────────────

    async function init() {
      if (!patientId) { alert('ID paziente mancante'); return }

      const { data: { session } } = await _supabase.auth.getSession()
      if (!session) { window.location.href = 'login.html'; return }

      const { data: p } = await _supabase.from('patients').select('nome, cognome, problema_principale, note_cliniche').eq('id', patientId).single()
      if (!p) { alert('Paziente non trovato'); return }
      patient = p
      document.getElementById('nav-title').textContent = p.nome + ' ' + p.cognome + ' — Visite'
      document.getElementById('btn-back').onclick = () => { window.location.href = 'paziente.html?id=' + patientId }

      await caricaVisite()
    }

    async function caricaVisite() {
      const { data } = await _supabase
        .from('visite').select('*').eq('patient_id', patientId).order('data_visita', { ascending: false })
      visite = data || []
      renderTimeline()
    }

    // ── Timeline ──────────────────────────────────────────

    const MESI = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic']
    const SLOT_LABELS = {
      'sag-sx': 'Sag. Sx', 'sag-dx': 'Sag. Dx',
      'frontale': 'Frontale', 'posteriore': 'Posteriore',
      'podo-sotto': 'Piede sotto', 'podo-dietro': 'Piede dietro'
    }

    function renderTimeline() {
      const container = document.getElementById('timeline')
      const empty     = document.getElementById('timeline-empty')

      container.querySelectorAll('.visit-card').forEach(el => el.remove())

      if (!visite.length) {
        const notaClinica = [patient.problema_principale, patient.note_cliniche].filter(Boolean).join('\n\n')
        const noteCardHtml = notaClinica ? `
          <div class="empty-notes-card">
            <div class="empty-notes-title">📋 Problematica iniziale</div>
            <div class="empty-notes-text">${escHtml(notaClinica)}</div>
          </div>` : ''
        empty.innerHTML = `
          <div class="empty-patient-name">${escHtml(patient.nome + ' ' + patient.cognome)}</div>
          ${noteCardHtml}
          <button class="btn-prima-visita" onclick="apriNuovaVisita()">📅 Aggiungi prima visita</button>
          <p class="empty-cta-desc">Registra la prima visita di controllo per iniziare a monitorare i progressi nel tempo</p>
        `
        empty.style.display = 'block'
        return
      }
      empty.style.display = 'none'

      visite.forEach(v => {
        const card = buildCard(v)
        container.appendChild(card)
      })
    }

    function buildCard(v) {
      const d    = new Date(v.data_visita + 'T12:00:00')
      const day  = d.getDate()
      const mon  = MESI[d.getMonth()]
      const year = d.getFullYear()

      let fotos = {}
      try { fotos = JSON.parse(v.foto_url || '{}') } catch(e) {}
      const thumbSrcs = Object.values(fotos).filter(Boolean).slice(0, 4)

      const card = document.createElement('div')
      card.className = 'visit-card'
      card.dataset.id = v.id

      const configBadge = v.configurazione
        ? `<span class="badge badge-${v.configurazione.toLowerCase()}">${v.configurazione}</span>` : ''
      const tipoBadge = v.tipo === 'prima-visita'
        ? '<span class="badge badge-prima">Prima visita</span>'
        : '<span class="badge badge-controllo">Controllo</span>'
      const noteText = v.note ? (v.note.length > 100 ? v.note.slice(0, 100) + '…' : v.note) : ''
      const notePreview = noteText ? `<div class="visit-note-preview">${escHtml(noteText)}</div>` : ''
      const thumbsHtml = thumbSrcs.map(src =>
        `<img class="visit-thumb" src="${src}" alt="">`).join('')

      card.innerHTML = `
        <div class="visit-header" onclick="toggleCard(this)">
          <div class="visit-date-col">
            <div class="visit-day">${day}</div>
            <div class="visit-month">${mon}</div>
            <div class="visit-year">${year}</div>
          </div>
          <div class="visit-divider"></div>
          <div class="visit-main">
            <div class="visit-badges">${tipoBadge}${configBadge}</div>
            ${notePreview}
            <div class="visit-thumbs">${thumbsHtml}</div>
            <button class="btn-vedi-dettaglio" onclick="event.stopPropagation();toggleCard(this.closest('.visit-header'))">Vedi dettaglio ▾</button>
          </div>
        </div>
        <div class="visit-detail">${buildDetail(v, fotos)}</div>
      `
      return card
    }

    function buildDetail(v, fotos) {
      let html = ''
      if (v.note) {
        html += `<div class="detail-label">Note</div><div class="detail-note">${escHtml(v.note)}</div>`
      }
      const fotoSlots = ['sag-sx','sag-dx','frontale','posteriore','podo-sotto','podo-dietro']
      const hasFotos = fotoSlots.some(s => fotos[s])
      if (hasFotos) {
        html += '<div class="detail-label" style="margin-top:14px">Foto</div><div class="detail-foto-grid">'
        fotoSlots.forEach(s => {
          if (fotos[s]) {
            html += `<div class="detail-foto-box">
              <div class="detail-foto-bar">${SLOT_LABELS[s]}</div>
              <img class="detail-foto-img" src="${fotos[s]}" alt="${SLOT_LABELS[s]}">
            </div>`
          }
        })
        html += '</div>'
      }
      if (!v.note && !hasFotos) html = '<div style="color:#555;font-size:13px">Nessun dettaglio.</div>'
      return html
    }

    function toggleCard(header) {
      const toggle = header.querySelector('.visit-toggle')
      const detail = header.nextElementSibling
      const isOpen = detail.classList.contains('open')
      detail.classList.toggle('open', !isOpen)
      toggle.classList.toggle('open', !isOpen)
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    }

    // ── New Visit Panel ───────────────────────────────────

    function apriNuovaVisita() {
      nvTipo   = 'controllo'
      nvConfig = null
      nvFotos  = {}
      document.getElementById('nv-data').value = new Date().toISOString().split('T')[0]
      document.getElementById('nv-note').value = ''
      setTipo('controllo')
      resetAllSlots()
      document.getElementById('btn-ai-visita').classList.remove('visible')
      document.getElementById('ai-loading-visita').classList.remove('visible')
      document.getElementById('ai-result-box').classList.remove('visible')
      document.getElementById('nvp').classList.add('open')
    }

    function chiudiNuovaVisita() {
      document.getElementById('nvp').classList.remove('open')
    }

    function setTipo(t) {
      nvTipo = t
      document.getElementById('tipo-prima').classList.toggle('active', t === 'prima-visita')
      document.getElementById('tipo-controllo').classList.toggle('active', t === 'controllo')
    }

    function resetAllSlots() {
      ['sag-sx','sag-dx','frontale','posteriore','podo-sotto','podo-dietro'].forEach(s => {
        const el = document.getElementById('nv-slot-' + s)
        if (!el) return
        el.classList.remove('has-photo')
        el.innerHTML = `<div class="slot-label-v">${slotDefaultLabel(s)}</div><div class="slot-icon-v">${s.startsWith('podo') ? '🦶' : '📷'}</div>`
        el.onclick = () => apriFotoSlot(s)
      })
    }

    function slotDefaultLabel(s) {
      const m = { 'sag-sx':'Sinistro','sag-dx':'Destro','frontale':'Frontale','posteriore':'Posteriore','podo-sotto':'Piede da sotto','podo-dietro':'Piede da dietro' }
      return m[s] || s
    }

    // ── Foto handling (new visit) ─────────────────────────

    function apriFotoSlot(slot) {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        apriCam(slot)
      } else {
        document.getElementById('nv-input-' + slot)?.click()
      }
    }

    function handleNVFoto(slot, input) {
      const file = input.files[0]; if (!file) return
      const reader = new FileReader()
      reader.onload = e => {
        resizeNV(e.target.result, 1200, 1600, dataUrl => {
          setSlotPhoto(slot, dataUrl)
        })
      }
      reader.readAsDataURL(file)
    }

    function resizeNV(src, maxW, maxH, cb) {
      const img = new Image()
      img.onload = () => {
        let w = img.width, h = img.height
        if (w > maxW || h > maxH) { const r = Math.min(maxW/w, maxH/h); w = Math.round(w*r); h = Math.round(h*r) }
        const c = document.createElement('canvas'); c.width = w; c.height = h
        c.getContext('2d').drawImage(img, 0, 0, w, h)
        cb(c.toDataURL('image/jpeg', 0.82))
      }
      img.src = src
    }

    function setSlotPhoto(slot, dataUrl) {
      nvFotos[slot] = dataUrl
      const el = document.getElementById('nv-slot-' + slot)
      if (!el) return
      el.classList.add('has-photo')
      el.innerHTML = `<img src="${dataUrl}" alt="${slot}"><div class="slot-overlay-v" onclick="event.stopPropagation();apriFotoSlot('${slot}')">Cambia</div>`
      el.onclick = null
      // Show AI button if at least one sagittal photo loaded
      if (nvFotos['sag-sx'] || nvFotos['sag-dx']) {
        document.getElementById('btn-ai-visita').classList.add('visible')
      }
    }

    // ── AI Analysis ───────────────────────────────────────

    async function avviaAIVisita() {
      const fotos = [nvFotos['sag-sx'], nvFotos['sag-dx']].filter(Boolean)
      if (!fotos.length) { alert('Carica almeno una foto sagittale'); return }

      document.getElementById('btn-ai-visita').classList.remove('visible')
      document.getElementById('ai-loading-visita').classList.add('visible')
      document.getElementById('ai-result-box').classList.remove('visible')

      const content = [
        { type: 'text', text: 'Analizza le seguenti foto posturali (piano sagittale). Determina se il paziente ha una postura di tipo ANTERIORE (NPL) o POSTERIORE (GPL). Rispondi in max 3 frasi, spiega brevemente perché.' },
        ...fotos.map(f => ({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: f.replace(/^data:image\/\w+;base64,/, '') } }))
      ]
      const systemPrompt = 'Sei un fisioterapista esperto in posturologia. ANTERIORE = postura NPL (proiezione anteriore del baricentro). POSTERIORE = postura GPL (proiezione posteriore). Rispondi solo sulla base delle immagini.'

      try {
        const res = await fetch('/api/analisi-posturale', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ system: systemPrompt, content })
        })
        const data = await res.json()
        document.getElementById('ai-loading-visita').classList.remove('visible')
        document.getElementById('ai-result-text').textContent = data.testo || 'Nessuna risposta.'
        document.getElementById('ai-result-box').classList.add('visible')
      } catch(e) {
        document.getElementById('ai-loading-visita').classList.remove('visible')
        document.getElementById('btn-ai-visita').classList.add('visible')
        alert('Errore AI: ' + e.message)
      }
    }

    function setConfigVisita(cfg) {
      nvConfig = cfg
      document.getElementById('ai-result-box').style.borderColor = cfg === 'NPL' ? '#9AFF00' : '#FFD008'
      alert(`Configurazione ${cfg} salvata. Clicca "Salva" per completare la visita.`)
    }

    // ── Save visita ───────────────────────────────────────

    async function salvaVisita() {
      const data = document.getElementById('nv-data').value
      if (!data) { alert('Inserisci la data della visita'); return }

      const { error } = await _supabase.from('visite').insert({
        patient_id:     patientId,
        data_visita:    data,
        tipo:           nvTipo,
        note:           document.getElementById('nv-note').value.trim() || null,
        configurazione: nvConfig,
        foto_url:       Object.keys(nvFotos).length ? JSON.stringify(nvFotos) : null
      })

      if (error) { alert('Errore salvataggio: ' + error.message); return }
      chiudiNuovaVisita()
      await caricaVisite()
    }

    // ── Camera (same logic as paziente.html) ──────────────

    function apriCam(slot) {
      _camSlot = slot
      const noPosto = ['podo-sotto','podo-dietro']
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        }).then(stream => {
          _camStream = stream
          document.getElementById('cam-video').srcObject = stream
          document.getElementById('cam-modal').classList.add('open')
          document.getElementById('cam-sagoma-wrap').classList.toggle('visible', !noPosto.includes(slot))
          initCamLivella()
        }).catch(() => {
          document.getElementById('nv-input-' + slot)?.click()
        })
      } else {
        document.getElementById('nv-input-' + slot)?.click()
      }
    }

    function initCamLivella() {
      const start = () => {
        if (_orientHdlr) return
        _orientHdlr = e => {
          const g = e.gamma != null ? e.gamma : 0
          document.getElementById('cam-debug').textContent = `γ ${g.toFixed(2)}°`
          const shift = Math.max(-90, Math.min(90, g * 5))
          document.getElementById('cam-livella-inner').style.transform = `translateY(${shift}px)`
          const ok = Math.abs(g) <= 2
          document.getElementById('cam-livella-line').style.background = ok ? '#00C853' : '#e53935'
          document.getElementById('cam-livella-line').style.boxShadow  = ok ? '0 0 10px #00C85355' : '0 0 8px rgba(229,57,53,0.7)'
          document.getElementById('cam-livella-testo').style.color     = ok ? '#00C853' : '#e53935'
          document.getElementById('cam-livella-testo').textContent     = ok ? 'In asse ✓' : `${Math.abs(g).toFixed(1)}°`
        }
        window.addEventListener('deviceorientation', _orientHdlr, true)
      }
      const needsPerm = typeof DeviceOrientationEvent !== 'undefined' &&
                        typeof DeviceOrientationEvent.requestPermission === 'function'
      if (needsPerm) {
        const btn = document.getElementById('cam-ios-btn')
        btn.textContent = '🎯 Abilita Livella'
        btn.style.display = 'block'
        btn.onclick = async () => {
          try {
            const p = await DeviceOrientationEvent.requestPermission()
            if (p === 'granted') { btn.style.display = 'none'; start() }
          } catch(err) { btn.textContent = 'Permesso negato' }
        }
      } else {
        start()
      }
    }

    function chiudiCam() {
      if (_camStream) { _camStream.getTracks().forEach(t => t.stop()); _camStream = null }
      if (_orientHdlr) { window.removeEventListener('deviceorientation', _orientHdlr, true); _orientHdlr = null }
      document.getElementById('cam-modal').classList.remove('open')
      document.getElementById('cam-sagoma-wrap').classList.remove('visible')
      document.getElementById('cam-livella-inner').style.transform = ''
      document.getElementById('cam-livella-line').style.background = '#e53935'
      document.getElementById('cam-livella-testo').textContent = '—'
      document.getElementById('cam-debug').textContent = ''
      document.getElementById('cam-ios-btn').style.display = 'none'
    }

    function scattaCam() {
      const video = document.getElementById('cam-video')
      const raw = document.createElement('canvas')
      raw.width = video.videoWidth; raw.height = video.videoHeight
      raw.getContext('2d').drawImage(video, 0, 0)
      const slot = _camSlot
      chiudiCam()
      const tmp = new Image()
      tmp.onload = () => {
        let w = tmp.width, h = tmp.height
        if (w > 1200 || h > 1600) { const r = Math.min(1200/w, 1600/h); w = Math.round(w*r); h = Math.round(h*r) }
        const c = document.createElement('canvas'); c.width = w; c.height = h
        c.getContext('2d').drawImage(tmp, 0, 0, w, h)
        setSlotPhoto(slot, c.toDataURL('image/jpeg', 0.82))
      }
      tmp.src = raw.toDataURL()
    }

    function apriGalleriaCam() {
      const slot = _camSlot
      chiudiCam()
      document.getElementById('nv-input-' + slot)?.click()
    }

    init()
  </script>
</body>
