* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Montserrat', sans-serif; background: #f5f5f5; color: #000; min-height: 100vh; }
.topbar { background: #FFD008; padding: 16px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
.back-btn { background: #000; color: #FFD008; border: none; border-radius: 8px; padding: 8px 14px; font-family: Montserrat,sans-serif; font-weight: 700; cursor: pointer; font-size: 14px; }

.btn-new { background: #000; color: #FFD008; border: none; border-radius: 12px; padding: 14px 24px; font-family: Montserrat,sans-serif; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; margin-bottom: 24px; }
.session-item { background: #fff; border-radius: 12px; padding: 18px; margin-bottom: 12px; border: 1px solid #eee; cursor: pointer; transition: all 0.2s; }
.session-item:hover { border-color: #FFD008; }
.sih { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sid { font-size: 14px; font-weight: 700; }
.vas-pills { display: flex; gap: 8px; }
.vp { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
.vps { background: #ffe0e0; color: #c62828; }
.vpe { background: #e8f5e9; color: #2e7d32; }
.sip { font-size: 12px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty-state { text-align: center; padding: 48px 20px; color: #999; font-size: 14px; }
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; overflow-y: auto; padding: 20px; }
.modal.open { display: flex; align-items: flex-start; justify-content: center; }
.modal-content { background: #fff; border-radius: 20px; padding: 28px; width: 100%; max-width: 700px; margin: auto; }
.mh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.mt { font-size: 18px; font-weight: 900; }
.bc { background: #f5f5f5; border: none; border-radius: 8px; padding: 8px 14px; font-size: 18px; cursor: pointer; }
.det-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 300; overflow-y: auto; padding: 20px; }
.det-modal.open { display: flex; align-items: flex-start; justify-content: center; }
.det-content { background: #fff; border-radius: 20px; width: 100%; max-width: 700px; margin: auto; overflow: hidden; }
.det-header { background: #000; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; }
.det-date { color: #FFD008; font-size: 16px; font-weight: 700; }
.det-vas { display: flex; gap: 8px; margin-top: 6px; }
.bcd { background: #333; border: none; border-radius: 8px; padding: 8px 14px; font-size: 16px; cursor: pointer; color: #fff; }
.det-body { padding: 24px; }
.det-sec { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #f0f0f0; }
.det-sec:last-child { border-bottom: none; margin-bottom: 0; }
.det-lbl { font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; margin-bottom: 6px; }
.det-val { font-size: 14px; color: #000; line-height: 1.6; }
.vas-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
.vas-box { background: #f9f9f9; border-radius: 12px; padding: 16px; }
.vas-lbl { font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; margin-bottom: 10px; display: block; }
.vas-val { font-size: 32px; font-weight: 900; text-align: center; margin-bottom: 8px; }
.vas-sl { width: 100%; accent-color: #FFD008; }
.fg { margin-bottom: 18px; }
.fl { font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: block; }
.fi { width: 100%; padding: 12px 14px; border: 1.5px solid #ddd; border-radius: 10px; font-family: Montserrat,sans-serif; font-size: 13px; outline: none; resize: vertical; min-height: 60px; }
.fi:focus { border-color: #FFD008; }
input.fi { min-height: unset; resize: none; }
.btn-ai { background: #000; color: #FFD008; border: none; border-radius: 10px; padding: 12px 20px; font-family: Montserrat,sans-serif; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; width: 100%; justify-content: center; margin-bottom: 18px; }

.ai-badge { background: #FFD008; color: #000; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
.ai-loading { text-align: center; padding: 16px; font-size: 13px; color: #666; display: none; }
.ai-loading.visible { display: block; }
.btn-save { background: #FFD008; color: #000; border: none; border-radius: 10px; padding: 14px 24px; font-family: Montserrat,sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; width: 100%; margin-top: 8px; }
.cal-box { background: #f9f9f9; border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; display: flex; align-items: center; gap: 12px; cursor: pointer; border: 1.5px solid #eee; }
.cal-check { width: 24px; height: 24px; border-radius: 6px; border: 2px solid #ddd; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.btn-det-act { background: transparent; border: 1px solid #555; color: #ccc; padding: 6px 11px; border-radius: 6px; font-family: Montserrat,sans-serif; font-size: 12px; cursor: pointer; white-space: nowrap; }
.btn-det-act:hover { border-color: #FFD008; color: #FFD008; }
.btn-det-del { border-color: #c62828 !important; color: #ef9a9a !important; }
.btn-det-del:hover { border-color: #ef9a9a !important; }
.det-edit-ta { width: 100%; padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-family: Montserrat,sans-serif; font-size: 14px; resize: vertical; outline: none; min-height: 60px; line-height: 1.6; }
.det-edit-ta:focus { border-color: #FFD008; }
.btn-det-save { background: #FFD008; color: #000; border: none; border-radius: 8px; padding: 10px 20px; font-family: Montserrat,sans-serif; font-weight: 700; font-size: 13px; cursor: pointer; flex: 2; }
.btn-pdf-all { background: transparent; border: 2px solid #000; color: #000; border-radius: 12px; padding: 11px 24px; font-family: Montserrat,sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; width: 100%; margin-bottom: 16px; }
.btn-pdf-all:hover { background: #f5f5f5; }
.tpl-select { width:100%; padding:8px 12px; border:1.5px solid #ddd; border-radius:8px; font-family:Montserrat,sans-serif; font-size:13px; color:#555; background:#fafafa; cursor:pointer; margin-bottom:8px; }
.tpl-select:focus { outline:none; border-color:#FFD008; }
</style>
</head>
<body>
<div class="topbar">
  <button class="back-btn" onclick="torna()">Indietro</button>

      <label class="fl">Protocollo eseguito</label>

      <textarea class="fi" id="f-ps" rows="3" placeholder="Es. Tecnica dei 3 respiri, schema-1..."></textarea>

    <div class="fg"><label class="fl">Protocollo prossima seduta</label><textarea class="fi" id="f-pp" rows="2" placeholder="Es. Aggiungere schema-3..."></textarea></div>
    <div class="fg"><label class="fl">Data prossima seduta (opzionale)</label><input type="date" class="fi" id="f-dp" min="2024-01-01" max="2099-12-31"></div>

      <div class="cal-check" id="cal-check"></div>
      <div>
        <div style="font-size:13px;font-weight:700">Aggiungi a Google Calendar</div>
        <div style="font-size:11px;color:#999;margin-top:2px">Apre Google Calendar con la prossima seduta</div>
      </div>
    </div>
    <div class="fg"><label class="fl">Tecniche utilizzate</label><textarea class="fi" id="f-tec" rows="2" placeholder="Es. Mobilizzazione passiva..."></textarea></div>
    <div class="fg"><label class="fl">Risposta del paziente</label><textarea class="fi" id="f-risp" rows="2" placeholder="Es. Buona risposta..."></textarea></div>
    <div class="fg"><label class="fl">Note cliniche</label><textarea class="fi" id="f-note" rows="3" placeholder="Osservazioni libere..."></textarea></div>
    <button class="btn-save" onclick="salvaSeduta()">Salva seduta</button>
  </div>
</div>

<div class="det-modal" id="det-modal">
  <div class="det-content">
    <div class="det-header">
      <div>
        <div class="det-date" id="det-date">-</div>

      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
        <button class="btn-det-act" onclick="diarioModifica()">✏️ Modifica</button>
        <button class="btn-det-act" onclick="diarioPDFSeduta()">📄 PDF</button>

    </div>

</div>

function toggleCalendar() {

function apriNuovaSeduta() {
  var campi = ['f-ps','f-pp','f-tec','f-risp','f-note'];

    document.getElementById(campi[i]).value = '';
  }
  document.getElementById('vas-inizio').value = 5;
  document.getElementById('vas-fine').value = 3;

// ── TEMPLATE RAPIDI ──────────────────────────────────────────────────────────
var DIARIO_TEMPLATES = [
  { label: 'Cervicalgia',          testo: 'Mobilizzazioni cervicali C1-C7. Stretching scaleni e trapezio superiore. Terapia manuale faccette articolari. Esercizi di stabilizzazione cervicale.' },
  { label: 'Lombalgia',            testo: 'Mobilizzazioni lombari L4-S1. Rinforzo core: isometrici addominali e glutei. Stretching piriforme e flessori anca. Educazione posturale.' },
  { label: 'Spalla',               testo: 'Mobilizzazione gleno-omerale. Rinforzo cuffia dei rotatori (sopraspinato, infraspinato). Stretching catena posteriore. Progressione CCC e CCA.' },
  { label: 'Ginocchio',            testo: 'Rinforzo quadricipite e ischio-crurali. Propriocezione su pedana instabile. Mobilizzazione rotulea. Esercizi in catena cinematica chiusa.' },

  { label: 'Mobilità',             testo: 'Stretching attivo e passivo mirato. Mobilizzazioni accessorie. Incremento progressivo range of motion.' },
  { label: 'Rinforzo',             testo: 'Esercizi di rinforzo muscolare progressivo. Lavoro eccentrico e concentrico. Progressione carico adeguata alla fase.' },

];

function diarioTemplate(targetId, sel) {
  var val = sel.value;
  if (!val) return;
  var tpl = DIARIO_TEMPLATES.find(function(t){ return t.label === val; });
  if (tpl) {
    var ta = document.getElementById(targetId);
    ta.value = ta.value ? ta.value + '\n\n' + tpl.testo : tpl.testo;
  }
  sel.value = '';
}

// ── DUPLICA ULTIMA SEDUTA ─────────────────────────────────────────────────────
async function diarioDuplica() {
  var res = await _sb.from('therapy_sessions')
    .select('protocollo_prossima, tecniche')
    .eq('patient_id', pid)
    .order('data_seduta', { ascending: false })
    .limit(1);
  if (!res.data || res.data.length === 0) {
    alert('Nessuna seduta precedente da duplicare.');
    return;
  }
  var ultima = res.data[0];
  apriNuovaSeduta();
  if (ultima.protocollo_prossima) document.getElementById('f-ps').value = ultima.protocollo_prossima;
  if (ultima.tecniche)           document.getElementById('f-tec').value = ultima.tecniche;
}
// ── END DUPLICA / TEMPLATE ───────────────────────────────────────────────────

function chiudiModal() {
  document.getElementById('modal-seduta').classList.remove('open');
}

function chiudiDettaglio() {
  document.getElementById('det-modal').classList.remove('open');
  sedutaId = null;
}

async function init() {
  if (!pid) { window.location.href = 'dashboard.html'; return; }
  var sess = await _sb.auth.getSession();
  if (!sess.data.session) { window.location.href = 'login.html'; return; }
  var res = await _sb.from('patients').select('*').eq('id', pid).maybeSingle();
  if (!res.data) { window.location.href = 'dashboard.html'; return; }
  patient = res.data;
  document.getElementById('pname').textContent = patient.nome + ' ' + patient.cognome;
  var pr = await _sb.from('patient_protocols').select('*, patient_protocol_exercises(*, exercises(nome))').eq('patient_id', pid).eq('stato', 'attivo').order('created_at', { ascending: false }).limit(1);
  if (pr.data && pr.data.length > 0) protAtt = pr.data[0];
  // Popola select template
  var sel = document.querySelector('.tpl-select');
  if (sel) DIARIO_TEMPLATES.forEach(function(t){ var o=document.createElement('option'); o.value=t.label; o.textContent=t.label; sel.appendChild(o); });
  caricaSedute();
}

async function caricaSedute() {
  var res = await _sb.from('therapy_sessions').select('*').eq('patient_id', pid).order('data_seduta', { ascending: false });
  var lista = document.getElementById('lista-sedute');
  var s = res.data;
  if (!s || s.length === 0) {
    lista.innerHTML = '<div class="empty-state">Nessuna seduta registrata.<br>Premi + per aggiungere la prima.</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < s.length; i++) {
    var x = s[i];
    var d = new Date(x.data_seduta).toLocaleDateString('it-IT', {weekday:'long', day:'2-digit', month:'long', year:'numeric'});
    var prev = (x.protocollo_seduta || x.note_cliniche || x.tecniche || '-').substring(0, 80);
    var encoded = encodeURIComponent(JSON.stringify(x));
    html += '<div class="session-item" onclick="apriDet(this)" data-session="' + encoded.replace(/"/g, '&quot;') + '">';
    html += '<div class="sih"><div class="sid">' + d + '</div>';
    html += '<div class="vas-pills"><span class="vp vps">i:' + (x.vas_inizio != null ? x.vas_inizio : '-') + '</span>';
    html += '<span class="vp vpe">f:' + (x.vas_fine != null ? x.vas_fine : '-') + '</span></div></div>';
    html += '<div class="sip">' + prev + '</div></div>';
  }
  lista.innerHTML = html;
}

function apriDet(el) {
  var raw = decodeURIComponent(el.getAttribute('data-session'));
  var s = JSON.parse(raw);
  sedutaId = s.id;
  detSeduta = s;
  var d = new Date(s.data_seduta).toLocaleDateString('it-IT', {weekday:'long', day:'2-digit', month:'long', year:'numeric'});
  document.getElementById('det-date').textContent = d;
  document.getElementById('det-vas').innerHTML =
    '<span class="vp vps">VAS i:' + (s.vas_inizio != null ? s.vas_inizio : '-') + '</span>' +
    '<span class="vp vpe">VAS f:' + (s.vas_fine != null ? s.vas_fine : '-') + '</span>';
  var body = '';
  if (s.protocollo_seduta) body += '<div class="det-sec"><div class="det-lbl">Protocollo eseguito</div><div class="det-val">' + s.protocollo_seduta + '</div></div>';
  if (s.protocollo_prossima) body += '<div class="det-sec"><div class="det-lbl">Prossima seduta</div><div class="det-val">' + s.protocollo_prossima + '</div></div>';
  if (s.tecniche) body += '<div class="det-sec"><div class="det-lbl">Tecniche</div><div class="det-val">' + s.tecniche + '</div></div>';
  if (s.risposta_paziente) body += '<div class="det-sec"><div class="det-lbl">Risposta paziente</div><div class="det-val">' + s.risposta_paziente + '</div></div>';
  if (s.note_cliniche) body += '<div class="det-sec"><div class="det-lbl">Note cliniche</div><div class="det-val">' + s.note_cliniche + '</div></div>';
  if (s.feedback_paziente) body += '<div class="det-sec"><div class="det-lbl">Feedback paziente</div><div class="det-val">' + s.feedback_paziente + '</div></div>';
  if (!body) body = '<div style="text-align:center;padding:32px;color:#999">Nessun dettaglio.</div>';
  document.getElementById('det-body').innerHTML = body;
  document.getElementById('det-modal').classList.add('open');
}

async function eliminaSeduta() {
  if (!sedutaId) return;
  if (!confirm('Eliminare questa seduta?')) return;
  await _sb.from('therapy_sessions').delete().eq('id', sedutaId);
  chiudiDettaglio();
  caricaSedute();
}

async function precompilaAI() {
  var btn = document.getElementById('btn-ai');
  var loading = document.getElementById('ai-loading');
  btn.disabled = true;
  loading.classList.add('visible');
  var nomePaz = patient.nome + ' ' + patient.cognome;
  var problema = patient.problema_principale || 'non specificato';
  var esercizi = 'nessun protocollo';
  var nomeProt = '';
  if (protAtt) {
    nomeProt = protAtt.nome_personalizzato || 'Protocollo attivo';
    var exList = protAtt.patient_protocol_exercises || [];
    var nomi = [];
    for (var i = 0; i < exList.length; i++) {
      nomi.push(exList[i].exercises ? exList[i].exercises.nome : '-');
    }
    esercizi = nomi.join(', ');
  }
  var sp = await _sb.from('therapy_sessions').select('*').eq('patient_id', pid).order('data_seduta', { ascending: false }).limit(3);
  var storico = 'Prima seduta.';
  if (sp.data && sp.data.length > 0) {
    var parts = [];
    for (var j = 0; j < sp.data.length; j++) {
      var sx = sp.data[j];
      parts.push(new Date(sx.data_seduta).toLocaleDateString('it-IT') + ' VAS:' + sx.vas_inizio + '->' + sx.vas_fine + ' ' + (sx.protocollo_seduta || ''));
    }
    storico = parts.join(' | ');
  }
  var prompt = 'Fisioterapista. Paziente: ' + nomePaz + '. Problema: ' + problema + '. Protocollo: ' + nomeProt + ' esercizi: ' + esercizi + '. Storico: ' + storico + '. Rispondi SOLO JSON: {"protocollo_seduta":"...","protocollo_prossima":"...","tecniche":"...","risposta_paziente":"...","note_cliniche":"..."}';
  try {
    var sess = await _sb.auth.getSession();
    var tok = sess.data.session?.access_token || '';
    var r = await fetch('/api/ai-analisi', {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'Authorization': 'Bearer ' + tok},
      body: JSON.stringify({prompt: prompt})
    });
    if (r.status === 403) { var e403 = await r.json(); if (window.policettivoHandleAI403) window.policettivoHandleAI403(); else alert(e403.error || 'Limite AI raggiunto.'); btn.disabled = false; loading.classList.remove('visible'); return; }
    var data = await r.json();
    if (data.ai_uses !== undefined && window.policettivoShowAIBanner) window.policettivoShowAIBanner(data.ai_uses);
    var testo = data.testo || '';
    var match = testo.match(/\{[\s\S]*\}/);
    if (match) {
      try {
        var p = JSON.parse(match[0]);
        if (p.protocollo_seduta) document.getElementById('f-ps').value = p.protocollo_seduta;
        if (p.protocollo_prossima) document.getElementById('f-pp').value = p.protocollo_prossima;
        if (p.tecniche) document.getElementById('f-tec').value = p.tecniche;
        if (p.risposta_paziente) document.getElementById('f-risp').value = p.risposta_paziente;
        if (p.note_cliniche) document.getElementById('f-note').value = p.note_cliniche;
      } catch(_parseErr) { /* AI ha restituito JSON non valido — i campi rimangono vuoti */ }
    }
  } catch(e) {
    alert('Errore AI: ' + e.message);
  }
  btn.disabled = false;
  loading.classList.remove('visible');
}

async function salvaSeduta() {
  var vi = parseInt(document.getElementById('vas-inizio').value);
  var vf = parseInt(document.getElementById('vas-fine').value);
  var ps = document.getElementById('f-ps').value.trim();
  var pp = document.getElementById('f-pp').value.trim();
  var dp = document.getElementById('f-dp').value;
  var tec = document.getElementById('f-tec').value.trim();
  var risp = document.getElementById('f-risp').value.trim();
  var note = document.getElementById('f-note').value.trim();
  var sess = await _sb.auth.getSession();
  var profRes = await _sb.from('professionals').select('id').eq('user_id', sess.data.session.user.id).maybeSingle();
  var profId = profRes.data ? profRes.data.id : null;
  var ins = await _sb.from('therapy_sessions').insert({
    patient_id: pid,
    professional_id: profId,
    data_seduta: (function(){ var v = document.getElementById('f-ds').value; return v ? new Date(v + 'T12:00:00').toISOString() : new Date().toISOString(); })(),
    vas_inizio: vi,
    vas_fine: vf,
    protocollo_seduta: ps || null,
    protocollo_prossima: pp || null,
    tecniche: tec || null,
    risposta_paziente: risp || null,
    note_cliniche: note || null
  });
  if (ins.error) { alert('Errore: ' + ins.error.message); return; }
  if (calON && dp) {
    var d = new Date(dp);
    var pad = function(n) { return n.toString().padStart(2,'0'); };
    var ds = d.getFullYear() + '' + pad(d.getMonth()+1) + '' + pad(d.getDate()) + 'T090000';
    var df = d.getFullYear() + '' + pad(d.getMonth()+1) + '' + pad(d.getDate()) + 'T100000';
    var nom = patient ? patient.nome + ' ' + patient.cognome : 'Paziente';
    var url = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent('Seduta - ' + nom) + '&dates=' + ds + '/' + df + '&details=' + encodeURIComponent(pp || '');
    window.open(url, '_blank');
  }
  chiudiModal();
  caricaSedute();
}

function diarioEscHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function diarioRenderBody(s) {
  var body = '';
  if (s.protocollo_seduta)  body += '<div class="det-sec"><div class="det-lbl">Protocollo eseguito</div><div class="det-val">' + diarioEscHtml(s.protocollo_seduta) + '</div></div>';
  if (s.protocollo_prossima) body += '<div class="det-sec"><div class="det-lbl">Prossima seduta</div><div class="det-val">' + diarioEscHtml(s.protocollo_prossima) + '</div></div>';
  if (s.tecniche)            body += '<div class="det-sec"><div class="det-lbl">Tecniche</div><div class="det-val">' + diarioEscHtml(s.tecniche) + '</div></div>';
  if (s.risposta_paziente)   body += '<div class="det-sec"><div class="det-lbl">Risposta paziente</div><div class="det-val">' + diarioEscHtml(s.risposta_paziente) + '</div></div>';
  if (s.note_cliniche)       body += '<div class="det-sec"><div class="det-lbl">Note cliniche</div><div class="det-val">' + diarioEscHtml(s.note_cliniche) + '</div></div>';
  if (s.feedback_paziente)   body += '<div class="det-sec"><div class="det-lbl">Feedback paziente</div><div class="det-val">' + diarioEscHtml(s.feedback_paziente) + '</div></div>';
  if (!body) body = '<div style="text-align:center;padding:32px;color:#999">Nessun dettaglio.</div>';
  document.getElementById('det-body').innerHTML = body;
}

function diarioModifica() {
  if (!detSeduta) return;
  var html = '';
  html += '<div class="det-sec"><div class="det-lbl">Protocollo eseguito</div><textarea class="det-edit-ta" id="det-edit-ps" rows="3"></textarea></div>';
  html += '<div class="det-sec"><div class="det-lbl">Prossima seduta</div><textarea class="det-edit-ta" id="det-edit-pp" rows="2"></textarea></div>';
  html += '<div class="det-sec" style="border-bottom:none"><div class="det-lbl">Note cliniche</div><textarea class="det-edit-ta" id="det-edit-nc" rows="3"></textarea></div>';
  html += '<div style="display:flex;gap:8px;margin-top:16px">';
  html += '<button onclick="diarioCancellaModifica()" style="flex:1;background:transparent;border:1.5px solid #ddd;border-radius:8px;padding:10px;font-family:Montserrat,sans-serif;font-size:13px;cursor:pointer;color:#666">Annulla</button>';
  html += '<button onclick="diarioSalvaModifica()" class="btn-det-save">Salva modifiche</button>';
  html += '</div>';
  document.getElementById('det-body').innerHTML = html;
  document.getElementById('det-edit-ps').value = detSeduta.protocollo_seduta || '';
  document.getElementById('det-edit-pp').value = detSeduta.protocollo_prossima || '';
  document.getElementById('det-edit-nc').value = detSeduta.note_cliniche || '';
  document.getElementById('det-edit-ps').focus();
}

function diarioCancellaModifica() {
  if (!detSeduta) return;
  diarioRenderBody(detSeduta);
}

async function diarioSalvaModifica() {
  if (!sedutaId) return;
  var ps = document.getElementById('det-edit-ps').value.trim();
  var pp = document.getElementById('det-edit-pp').value.trim();
  var nc = document.getElementById('det-edit-nc').value.trim();
  var saveBtn = document.querySelector('#det-body .btn-det-save');
  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Salvataggio...'; }
  var res = await _sb.from('therapy_sessions').update({
    protocollo_seduta:  ps || null,
    protocollo_prossima: pp || null,
    note_cliniche:      nc || null
  }).eq('id', sedutaId);
  if (res.error) {
    alert('Errore salvataggio: ' + res.error.message);
    if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Salva modifiche'; }
    return;
  }
  detSeduta.protocollo_seduta  = ps || null;
  detSeduta.protocollo_prossima = pp || null;
  detSeduta.note_cliniche      = nc || null;
  diarioRenderBody(detSeduta);
  caricaSedute();
}
