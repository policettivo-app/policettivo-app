<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Policettivo®</title>
  <link rel="stylesheet" href="css/design-system.css">
  <style>
    body { margin: 0; background: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Montserrat', sans-serif; color: #fff; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #FFD008; animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="dot"></div>
  <script>
    (function () {
      function getCookie(name) {
        var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'))
        return m ? decodeURIComponent(m[1]) : null
      }

      // 1. Cookie patient_url — condiviso tra Safari e PWA su iOS (soluzione definitiva)
      var savedUrl = getCookie('patient_url')
      if (savedUrl) { window.location.replace(savedUrl); return }

      // 2. Cookie patient_token — fallback se il cookie dell'URL non c'è
      var t = getCookie('patient_token')
      if (t) { window.location.replace('/protocollo.html?token=' + encodeURIComponent(t)); return }

      // 3. localStorage — stesso browser context (non iOS Safari→PWA) o compat precedente
      savedUrl = localStorage.getItem('patient_url')
      if (savedUrl) { window.location.replace(savedUrl); return }

      t = localStorage.getItem('patient_token') || localStorage.getItem('policettivo_patient_token')
      if (t) { window.location.replace('/protocollo.html?token=' + encodeURIComponent(t)); return }

      // 4. Nessun token trovato — vai al login professionista
      window.location.replace('/login.html')
    })()
  </script>
</body>
</html>
