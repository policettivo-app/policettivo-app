    .select('*, patient_protocol_exercises(*, exercises(*))')
    .eq('patient_id', currentPatientId)

    .single();

  await loadSessions();
}

async function loadSessions() {
  const { data: sessions, error } = await sb.from('therapy_sessions')
    .select('*')
    .eq('patient_id', currentPatientId)
    .order('data_seduta', { ascending: false });

  const list = document.getElementById('sessionsList');

  if (error || !sessions || sessions.length === 0) {
    list.innerHTML = `
      <div class="empty-state">

        ${s.note_cliniche ? `<div class="session-note">${s.note_cliniche.substring(0,120)}${s.note_cliniche.length > 120 ? '...' : ''}</div>` : ''}

async function editSession(sessionId) {

  document.getElementById('durata').value = s.durata_minuti || '';
  document.getElementById('vasInizio').value = s.vas_inizio ?? 5;
  document.getElementById('vasInizioVal').textContent = s.vas_inizio ?? 5;
  document.getElementById('vasFine').value = s.vas_fine ?? 3;
  document.getElementById('vasFinale').textContent = s.vas_fine ?? 3;
  document.getElementById('protocolloSeduta').value = s.protocollo_seduta || '';
  document.getElementById('tecniche').value = s.tecniche || '';
  document.getElementById('rispostaPaziente').value = s.risposta_paziente || '';
  document.getElementById('noteCliniche').value = s.note_cliniche || '';
  document.getElementById('protocolloProssima').value = s.protocollo_prossima || '';
  document.getElementById('modalOverlay').classList.add('active');
}

async function runAI() {
  document.getElementById('aiLoading').classList.add('active');
  document.getElementById('aiSuggestProtocollo').classList.remove('visible');
  document.getElementById('aiSuggestNote').classList.remove('visible');
  document.getElementById('aiSuggestProssima').classList.remove('visible');

  try {
    const { data: sessions } = await sb.from('therapy_sessions')
      .select('*').eq('patient_id', currentPatientId)
      .order('data_seduta', { ascending: false }).limit(5);

    const { data: diary } = await sb.from('diary_entries')
      .select('*').eq('patient_id', currentPatientId)
      .order('created_at', { ascending: false }).limit(7);

    const protocolloEsercizi = currentProtocol?.patient_protocol_exercises
      ?.map(e => e.exercises?.nome || e.exercises?.codice).filter(Boolean).join(', ') || 'Non assegnato';

    const prompt = `Sei un assistente clinico per fisioterapisti. Analizza questi dati del paziente e fornisci suggerimenti per il diario seduta.

PAZIENTE: ${currentPatientData.nome} ${currentPatientData.cognome}
PROBLEMA PRINCIPALE: ${currentPatientData.problema_principale || 'non specificato'}
NOTE CLINICHE: ${currentPatientData.note_cliniche || 'nessuna'}

PROTOCOLLO ATTIVO: ${protocolloEsercizi}

ULTIME SEDUTE:
${sessions && sessions.length > 0 ? sessions.slice(0,3).map(s => `- ${s.data_seduta}: VAS ${s.vas_inizio}→${s.vas_fine}, risposta: ${s.risposta_paziente || 'n.d.'}, note: ${s.note_cliniche || 'nessuna'}`).join('\n') : 'Prima seduta'}

DIARIO PAZIENTE ULTIMI 7 GIORNI:
${diary && diary.length > 0 ? diary.map(d => `- ${new Date(d.created_at).toLocaleDateString('it-IT')}: dolore ${d.dolore || 'n.d.'}, rigidità ${d.rigidita || 'n.d.'}, energia ${d.energia || 'n.d.'}`).join('\n') : 'Nessun dato diario'}

Rispondi SOLO con un JSON valido in questo formato esatto:
{
  "protocollo_seduta": "descrizione concisa del protocollo da applicare oggi basato sul protocollo attivo",
  "note_cliniche": "osservazione clinica sintetica sul trend del paziente",
  "protocollo_prossima": "suggerimento per la prossima seduta come progressione logica"
}`;

    const response = await fetch('/api/ai-analisi', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });

    const result = await response.json();
    let aiText = result.testo || '';
    aiText = aiText.replace(/```json|```/g, '').trim();
    const ai = JSON.parse(aiText);

    if (ai.protocollo_seduta) {
      document.getElementById('protocolloSeduta').value = ai.protocollo_seduta;
      document.getElementById('aiSuggestProtocolloText').textContent = ai.protocollo_seduta;
      document.getElementById('aiSuggestProtocollo').classList.add('visible');
    }
    if (ai.note_cliniche) {
      document.getElementById('noteCliniche').value = ai.note_cliniche;
      document.getElementById('aiSuggestNoteText').textContent = ai.note_cliniche;
      document.getElementById('aiSuggestNote').classList.add('visible');
    }
    if (ai.protocollo_prossima) {
      document.getElementById('protocolloProssima').value = ai.protocollo_prossima;
      document.getElementById('aiSuggestProssimaText').textContent = ai.protocollo_prossima;
      document.getElementById('aiSuggestProssima').classList.add('visible');
    }
  } catch(e) {
    console.error('AI error:', e);
  }

  document.getElementById('aiLoading').classList.remove('active');
}

async function saveSession() {
  const data = {
    patient_id: currentPatientId,
    professional_id: currentProfessionalId,
    data_seduta: document.getElementById('dataSeduta').value,
    durata_minuti: parseInt(document.getElementById('durata').value) || null,
    vas_inizio: parseInt(document.getElementById('vasInizio').value),
    vas_fine: parseInt(document.getElementById('vasFine').value),
    protocollo_seduta: document.getElementById('protocolloSeduta').value,
    tecniche: document.getElementById('tecniche').value,
    risposta_paziente: document.getElementById('rispostaPaziente').value || null,
    note_cliniche: document.getElementById('noteCliniche').value,
    protocollo_prossima: document.getElementById('protocolloProssima').value
  };

  if (!data.data_seduta) { alert('Inserisci la data della seduta'); return; }

  let error;
  if (editingSessionId) {
    ({ error } = await sb.from('therapy_sessions').update(data).eq('id', editingSessionId));
  } else {
    ({ error } = await sb.from('therapy_sessions').insert(data));
  }

  if (error) { alert('Errore nel salvataggio: ' + error.message); return; }

  closeModal();
  await loadSessions();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  editingSessionId = null;
}

function goBack() {
  window.location.href = `paziente.html?id=${currentPatientId}`;
}

init();
</script>
